name: Final audio one-shot verification

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/final-audio-one-shot-trigger

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Focused player and Section contracts
        run: |
          node --experimental-strip-types --test \
            tests/audio-player-section-subtitle-contract.test.mjs \
            tests/audio-player-dock-contract.test.mjs \
            tests/audio-chapters.test.mjs \
            tests/audio-runtime-semantic-warm.test.mjs \
            tests/route-code-splitting-contract.test.mjs
      - name: Subtitle deployment guard
        run: npm run guard:subtitle-deployment
      - name: Audio runtime audit
        run: npm run audit:audio-runtime
      - name: Production build
        run: npm run build
      - name: Post-build subtitle deployment guard
        run: npm run guard:subtitle-deployment
      - name: Post-build audio runtime audit
        run: npm run audit:audio-runtime
