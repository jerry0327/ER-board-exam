name: Apply audio player redesign

on:
  push:
    branches:
      - agent/audio-sections-question-scope

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved player design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          companion = Path('app/components/audio-section-companion.tsx')
          text = companion.read_text()

          text = text.replace('''import {\n  Check,\n  ChevronDown,\n  Headphones,\n  Layers3,\n  ListTree,\n  Play,\n  X,\n} from "lucide-react";''', '''import {\n  ChevronDown,\n  ListTree,\n  X,\n} from "lucide-react";''')
          text = text.replace('''import {\n  audioSummaryDisplayMarker,\n  audioSummaryDisplayName,\n  audioSummaryDisplayTitle,\n  audioSummaryForId,\n  type AudioSummarySource,\n} from "../lib/audio-summaries";''', '''import {\n  audioSummaryForId,\n  type AudioSummarySource,\n} from "../lib/audio-summaries";''')

          text = text.replace('''    dock.classList.toggle("has-audio-sections", Boolean(activeBundle));\n    dock.classList.toggle("is-section-list-open", Boolean(activeBundle && sectionOpen));\n    dock.classList.toggle("is-question-scope", Boolean(activeScope));\n    return () => {\n      dock.classList.remove("has-audio-sections", "is-section-list-open", "is-question-scope");\n    };''', '''    dock.classList.toggle("has-audio-sections", Boolean(activeBundle));\n    dock.classList.toggle("is-question-scope", Boolean(activeScope));\n    return () => {\n      dock.classList.remove("has-audio-sections", "is-question-scope");\n    };''')

          text = re.sub(
              r'''  const currentIndex = currentChapter\n    \? chapters\.findIndex\(\(chapter\) => chapter\.id === currentChapter\.id\)\n    : -1;\n''',
              '',
              text,
          )

          old_summary = '''            <small>\n              {activeScope\n                ? "單題播放範圍"\n                : currentIndex >= 0\n                  ? `目前段落 ${currentIndex + 1} / ${chapters.length}`\n                  : "段落導覽"}\n              {activeScope && <span className="audio-section-scope-badge">播完即停</span>}\n            </small>'''
          text = text.replace(old_summary, '''            <small>{activeScope ? "只播放本題" : "目前段落"}</small>''')

          text = text.replace(
              '<span className="audio-section-number">{String(index + 1).padStart(2, "0")}</span>',
              '<span className="audio-section-list-dot" aria-hidden="true" />',
          )

          timeline_pattern = re.compile(r'''  const timelinePortal = activeBundle && timelineTarget && !activeScope\n    \? createPortal\([\s\S]*?\n    : null;\n\n  const scopeTimelinePortal''')
          timeline_replacement = '''  const timelinePortal = activeBundle && timelineTarget && !activeScope\n    ? createPortal(\n      <div className="audio-section-node-layer">\n        <span className="audio-section-track-base" aria-hidden="true" />\n        <span\n          className="audio-section-track-progress"\n          aria-hidden="true"\n          style={{ width: `${Math.min(100, Math.max(0, player.position / Math.max(1, player.duration) * 100))}%` }}\n        />\n        {markers.map((marker, index) => {\n          const chapter = chapters[index];\n          if (!chapter) return null;\n          const left = Math.min(100, Math.max(0, marker.playerStartSeconds / Math.max(1, player.duration) * 100));\n          const isCurrent = chapter.id === currentChapter?.id;\n          const isPast = marker.playerStartSeconds <= player.position;\n          const label = sectionLabel(activeBundle, chapter);\n          return (\n            <button\n              key={marker.id}\n              type="button"\n              className={`audio-section-node ${isCurrent ? "is-current" : ""} ${isPast ? "is-past" : ""}`.trim()}\n              style={{ left: `${left}%` }}\n              aria-label={`從 ${formatTime(marker.playerStartSeconds)} 播放：${label}`}\n              onClick={(event) => {\n                event.preventDefault();\n                event.stopPropagation();\n                seekChapter(chapter);\n              }}\n            >\n              <span className="audio-section-node-tooltip" role="tooltip">\n                <strong>{label}</strong>\n                <time>{formatTime(marker.playerStartSeconds)}</time>\n              </span>\n            </button>\n          );\n        })}\n      </div>,\n      timelineTarget,\n    )\n    : null;\n\n  const scopeTimelinePortal'''
          text, count = timeline_pattern.subn(timeline_replacement, text, count=1)
          if count != 1:
              raise SystemExit('timeline portal replacement failed')

          text = text.replace('''              <div>\n                <small>題庫詳解音檔</small>\n                <strong id="question-audio-choice-title">選擇播放方式</strong>\n              </div>''', '''              <strong id="question-audio-choice-title">選擇播放方式</strong>''')

          text = re.sub(r'''            \{choiceSource && \(\n              <div className="audio-question-source">[\s\S]*?\n              </div>\n            \)\}\n''', '', text, count=1)

          first_button = re.compile(r'''              <button\n                type="button"\n                className="audio-question-choice-option"\n                disabled=\{!choiceSource \|\| loadingChoice\}\n                onClick=\{\(\) => void chooseFullQuestionSet\(\)\}\n              >[\s\S]*?              </button>''')
          text, count = first_button.subn('''              <button\n                type="button"\n                className="audio-question-choice-option"\n                disabled={!choiceSource || loadingChoice}\n                onClick={() => void chooseFullQuestionSet()}\n              >\n                <span>完整音檔</span>\n              </button>''', text, count=1)
          if count != 1:
              raise SystemExit('full audio button replacement failed')

          second_button = re.compile(r'''              <button\n                type="button"\n                className="audio-question-choice-option"\n                disabled=\{!choiceSource \|\| loadingChoice\}\n                onClick=\{\(\) => void chooseQuestionOnly\(\)\}\n              >[\s\S]*?              </button>''')
          text, count = second_button.subn('''              <button\n                type="button"\n                className="audio-question-choice-option"\n                disabled={!choiceSource || loadingChoice}\n                aria-busy={loadingChoice || undefined}\n                onClick={() => void chooseQuestionOnly()}\n              >\n                <span>{loadingChoice ? "載入中…" : "只播放本題"}</span>\n              </button>''', text, count=1)
          if count != 1:
              raise SystemExit('question-only button replacement failed')

          companion.write_text(text)

          provider = Path('app/components/audio-player-provider.tsx')
          provider_text = provider.read_text()
          provider_text = provider_text.replace('aria-label="快進 30 秒"', 'aria-label="快進 15 秒"')
          provider_text = provider_text.replace('onClick={() => jumpBy(30)}', 'onClick={() => jumpBy(15)}')
          provider_text = provider_text.replace('<span>30</span><RotateCw aria-hidden="true" />', '<span>15</span><RotateCw aria-hidden="true" />')
          provider.write_text(provider_text)

          css = Path('app/site.css')
          css_text = css.read_text()
          marker = '/* Audio Player 2026 Section Redesign */'
          if marker not in css_text:
              css_text = css_text.rstrip() + r'''\n\n@layer site-components {\n  /* Audio Player 2026 Section Redesign */\n  .audio-player-dock {\n    background: var(--site-paper);\n    border: 1px solid var(--site-line);\n    border-radius: 14px;\n    box-shadow: var(--site-shadow-low);\n    overflow: visible;\n  }\n\n  .audio-player-dock.is-expanded {\n    border-radius: 14px;\n    width: min(760px, calc(100vw - 28px));\n  }\n\n  .audio-player-dock.is-collapsed {\n    border-radius: 14px;\n    width: min(390px, calc(100vw - 24px));\n  }\n\n  .audio-player-edge-progress,\n  .audio-player-mark,\n  .audio-player-stow {\n    display: none;\n  }\n\n  .audio-player-mini {\n    background: transparent;\n    border: 0;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-mini {\n    align-items: center;\n    display: grid;\n    gap: 8px 10px;\n    grid-template-columns: 38px minmax(0, 1fr) auto 30px;\n    min-height: 62px;\n    padding: 9px 11px;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-mini-toggle {\n    background: transparent;\n    border: 1px solid color-mix(in srgb, var(--site-primary) 52%, var(--site-line));\n    border-radius: 50%;\n    color: var(--site-primary);\n    grid-column: 1;\n    grid-row: 1 / span 2;\n    height: 38px;\n    width: 38px;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-title {\n    align-items: start;\n    display: grid;\n    gap: 2px;\n    grid-column: 2;\n    grid-row: 1 / span 2;\n    min-width: 0;\n    padding: 0;\n    text-align: left;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-title strong {\n    font-size: 12px;\n    line-height: 1.35;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-title span {\n    color: var(--site-muted);\n    font-size: 10px;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-mini-time {\n    color: var(--site-muted);\n    font-family: var(--site-mono);\n    font-size: 10px;\n    grid-column: 3;\n    white-space: nowrap;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-expand {\n    background: transparent;\n    border: 0;\n    color: var(--site-muted);\n    grid-column: 4;\n    height: 30px;\n    width: 30px;\n  }\n\n  .audio-player-dock.is-collapsed .audio-player-mini-close {\n    display: none;\n  }\n\n  .audio-player-dock.is-expanded .audio-player-mini {\n    align-items: center;\n    display: grid;\n    gap: 10px;\n    grid-template-columns: minmax(0, 1fr) 32px;\n    padding: 16px 18px 5px;\n  }\n\n  .audio-player-dock.is-expanded .audio-player-title {\n    grid-column: 1;\n    min-width: 0;\n    padding: 0;\n    text-align: left;\n  }\n\n  .audio-player-dock.is-expanded .audio-player-title strong {\n    font-size: 14px;\n    font-weight: 720;\n    line-height: 1.4;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .audio-player-dock.is-expanded .audio-player-title span,\n  .audio-player-dock.is-expanded .audio-player-mini-time,\n  .audio-player-dock.is-expanded .audio-player-mini-toggle,\n  .audio-player-dock.is-expanded .audio-player-mini-close {\n    display: none;\n  }\n\n  .audio-player-dock.is-expanded .audio-player-expand {\n    background: transparent;\n    border: 0;\n    color: var(--site-muted);\n    grid-column: 2;\n    height: 32px;\n    width: 32px;\n  }\n\n  .audio-player-details {\n    gap: 10px;\n    padding: 3px 18px 15px;\n  }\n\n  .audio-section-companion {\n    border: 0;\n    margin: 0;\n    padding: 0;\n    position: relative;\n  }\n\n  .audio-section-summary {\n    align-items: end;\n    min-height: 46px;\n  }\n\n  .audio-section-current small {\n    color: var(--site-muted);\n    font-size: 10px;\n    margin-bottom: 3px;\n  }\n\n  .audio-section-current strong {\n    color: var(--site-primary);\n    font-size: 12px;\n    font-weight: 760;\n  }\n\n  .audio-section-toggle {\n    background: transparent;\n    border: 1px solid var(--site-line);\n    border-radius: 8px;\n    color: var(--site-ink-soft);\n    min-height: 32px;\n    padding: 0 9px;\n  }\n\n  .audio-section-toggle:hover {\n    background: color-mix(in srgb, var(--site-primary) 6%, var(--site-paper));\n    border-color: color-mix(in srgb, var(--site-primary) 38%, var(--site-line));\n  }\n\n  .audio-section-panel {\n    background: var(--site-paper);\n    border: 1px solid var(--site-line);\n    border-radius: 10px;\n    box-shadow: var(--site-shadow-overlay);\n    margin: 0;\n    max-height: min(46vh, 330px);\n    overflow: auto;\n    padding: 5px;\n    position: absolute;\n    right: 0;\n    top: calc(100% + 7px);\n    width: min(360px, calc(100vw - 52px));\n    z-index: 12;\n  }\n\n  .audio-section-list button {\n    gap: 9px;\n    grid-template-columns: 10px minmax(0, 1fr) auto;\n    min-height: 38px;\n    padding: 6px 8px;\n  }\n\n  .audio-section-list-dot {\n    background: var(--site-paper);\n    border: 1px solid var(--site-line-strong);\n    border-radius: 50%;\n    height: 7px;\n    width: 7px;\n  }\n\n  .audio-section-list button.is-current .audio-section-list-dot {\n    background: var(--site-primary);\n    border-color: var(--site-primary);\n    box-shadow: 0 0 0 3px color-mix(in srgb, var(--site-primary) 10%, transparent);\n  }\n\n  .audio-section-number {\n    display: none;\n  }\n\n  .audio-player-timeline {\n    min-height: 44px;\n    position: relative;\n  }\n\n  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"] {\n    appearance: none;\n    background: transparent;\n    cursor: pointer;\n    height: 24px;\n    margin: 0;\n    position: relative;\n    width: 100%;\n    z-index: 5;\n  }\n\n  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-webkit-slider-runnable-track {\n    background: transparent;\n    height: 3px;\n  }\n\n  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-moz-range-track {\n    background: transparent;\n    height: 3px;\n  }\n\n  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-webkit-slider-thumb {\n    appearance: none;\n    background: var(--site-paper);\n    border: 2px solid var(--site-primary);\n    border-radius: 50%;\n    box-shadow: 0 1px 4px color-mix(in srgb, var(--site-ink) 20%, transparent);\n    height: 12px;\n    margin-top: -4.5px;\n    width: 12px;\n  }\n\n  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-moz-range-thumb {\n    background: var(--site-paper);\n    border: 2px solid var(--site-primary);\n    border-radius: 50%;\n    box-shadow: 0 1px 4px color-mix(in srgb, var(--site-ink) 20%, transparent);\n    height: 12px;\n    width: 12px;\n  }\n\n  .audio-section-node-layer {\n    height: 24px;\n    left: 0;\n    pointer-events: none;\n    position: absolute;\n    right: 0;\n    top: 0;\n    z-index: 4;\n  }\n\n  .audio-section-track-base,\n  .audio-section-track-progress {\n    border-radius: 2px;\n    height: 3px;\n    left: 0;\n    position: absolute;\n    top: 10.5px;\n  }\n\n  .audio-section-track-base {\n    background: color-mix(in srgb, var(--site-line-strong) 42%, var(--site-paper));\n    right: 0;\n  }\n\n  .audio-section-track-progress {\n    background: linear-gradient(90deg, var(--site-primary-strong), var(--site-primary));\n  }\n\n  .audio-section-node {\n    background: var(--site-paper);\n    border: 1.5px solid color-mix(in srgb, var(--site-line-strong) 78%, var(--site-paper));\n    border-radius: 50%;\n    cursor: pointer;\n    height: 8px;\n    padding: 0;\n    pointer-events: auto;\n    position: absolute;\n    top: 7.5px;\n    transform: translateX(-50%);\n    transition: transform 150ms var(--site-ease), box-shadow 150ms var(--site-ease), background-color 150ms var(--site-ease), border-color 150ms var(--site-ease);\n    width: 8px;\n  }\n\n  .audio-section-node.is-past {\n    border-color: var(--site-primary);\n  }\n\n  .audio-section-node.is-current {\n    background: var(--site-primary);\n    border-color: var(--site-primary);\n  }\n\n  .audio-section-node:hover,\n  .audio-section-node:focus-visible {\n    background: var(--site-primary);\n    border-color: var(--site-primary);\n    box-shadow:\n      0 0 0 5px color-mix(in srgb, var(--site-primary) 12%, transparent),\n      0 0 22px color-mix(in srgb, var(--site-primary) 32%, transparent);\n    outline: 0;\n    transform: translateX(-50%) scale(1.3);\n    z-index: 8;\n  }\n\n  .audio-section-node-tooltip {\n    background: linear-gradient(135deg, var(--site-primary-strong), color-mix(in srgb, var(--site-primary) 84%, var(--site-ink)));\n    border-radius: 8px;\n    bottom: calc(100% + 10px);\n    box-shadow: 0 12px 30px color-mix(in srgb, var(--site-ink) 24%, transparent);\n    color: var(--site-on-primary);\n    display: grid;\n    gap: 2px;\n    left: 50%;\n    max-width: 260px;\n    min-width: 138px;\n    opacity: 0;\n    padding: 7px 9px;\n    pointer-events: none;\n    position: absolute;\n    transform: translate(-50%, 5px);\n    transition: opacity 140ms var(--site-ease), transform 140ms var(--site-ease);\n    visibility: hidden;\n    white-space: normal;\n  }\n\n  .audio-section-node-tooltip strong {\n    font-size: 11px;\n    line-height: 1.35;\n  }\n\n  .audio-section-node-tooltip time {\n    font-family: var(--site-mono);\n    font-size: 9px;\n    opacity: .78;\n  }\n\n  .audio-section-node:hover .audio-section-node-tooltip,\n  .audio-section-node:focus-visible .audio-section-node-tooltip {\n    opacity: 1;\n    transform: translate(-50%, 0);\n    visibility: visible;\n  }\n\n  .audio-player-timeline > div:last-child {\n    color: var(--site-muted);\n    font-family: var(--site-mono);\n    font-size: 10px;\n    margin-top: -1px;\n  }\n\n  .audio-player-controls {\n    align-items: center;\n    border-top: 0;\n    display: grid;\n    gap: 10px 14px;\n    grid-template-columns: auto minmax(0, 1fr) auto;\n    padding-top: 4px;\n  }\n\n  .audio-player-rate {\n    min-width: 64px;\n  }\n\n  .audio-player-rate > span {\n    display: none;\n  }\n\n  .audio-player-rate select {\n    min-height: 32px;\n    padding-block: 0;\n  }\n\n  .audio-player-transport {\n    gap: 7px;\n    justify-content: center;\n  }\n\n  .audio-player-main-toggle {\n    background: var(--site-primary-fill);\n    border-color: var(--site-primary-fill);\n    border-radius: 50%;\n    color: var(--site-on-primary);\n    height: 42px;\n    width: 42px;\n  }\n\n  .audio-player-skip,\n  .audio-player-chapter-control,\n  .audio-player-utility {\n    background: transparent;\n    border-color: transparent;\n    border-radius: 50%;\n    height: 34px;\n    width: 34px;\n  }\n\n  .audio-player-skip:hover,\n  .audio-player-chapter-control:hover,\n  .audio-player-utility:hover {\n    background: color-mix(in srgb, var(--site-primary) 7%, var(--site-paper));\n    border-color: var(--site-line);\n  }\n\n  .audio-player-options {\n    border-top: 1px solid var(--site-line);\n    display: flex;\n    gap: 6px;\n    overflow-x: auto;\n    padding-top: 8px;\n  }\n\n  .audio-player-option {\n    background: transparent;\n    border: 1px solid var(--site-line);\n    border-radius: 8px;\n    flex: 0 0 auto;\n    min-height: 31px;\n    padding: 0 8px;\n  }\n\n  .audio-player-option span strong {\n    font-size: 10px;\n  }\n\n  .audio-player-option span small {\n    display: none;\n  }\n\n  .audio-question-choice {\n    max-width: 390px;\n    padding: 15px;\n  }\n\n  .audio-question-choice > header {\n    align-items: center;\n    grid-template-columns: minmax(0, 1fr) 34px;\n    margin-bottom: 10px;\n  }\n\n  .audio-question-choice > header > strong {\n    font-family: var(--site-display);\n    font-size: 17px;\n    line-height: 1.35;\n  }\n\n  .audio-question-choice-close {\n    height: 34px;\n    width: 34px;\n  }\n\n  .audio-question-source {\n    display: none;\n  }\n\n  .audio-question-choice-options {\n    display: grid;\n    gap: 8px;\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n\n  .audio-question-choice-option {\n    align-items: center;\n    background: var(--site-surface-muted);\n    border: 1px solid var(--site-line);\n    border-radius: 8px;\n    display: flex;\n    font-size: 12px;\n    font-weight: 760;\n    justify-content: center;\n    min-height: 42px;\n    padding: 0 10px;\n    text-align: center;\n  }\n\n  .audio-question-choice-option:hover {\n    background: color-mix(in srgb, var(--site-primary) 7%, var(--site-paper));\n    border-color: color-mix(in srgb, var(--site-primary) 42%, var(--site-line));\n  }\n\n  .audio-question-choice-option:first-child {\n    background: var(--site-primary-fill);\n    border-color: var(--site-primary-fill);\n    color: var(--site-on-primary);\n  }\n\n  .audio-question-choice-option:first-child:hover {\n    background: var(--site-primary-fill-strong);\n    border-color: var(--site-primary-fill-strong);\n  }\n\n  .audio-question-choice-option svg,\n  .audio-question-choice-option small {\n    display: none;\n  }\n\n  .audio-question-scope-timeline input {\n    accent-color: var(--site-primary);\n    height: 24px;\n  }\n\n  @media (max-width: 600px) {\n    .audio-player-dock.is-expanded {\n      width: calc(100vw - 16px);\n    }\n\n    .audio-player-dock.is-collapsed {\n      width: min(360px, calc(100vw - 16px));\n    }\n\n    .audio-player-dock.is-expanded .audio-player-mini {\n      padding: 13px 13px 3px;\n    }\n\n    .audio-player-details {\n      gap: 8px;\n      padding: 2px 13px 12px;\n    }\n\n    .audio-section-summary {\n      min-height: 42px;\n    }\n\n    .audio-section-panel {\n      max-height: min(42vh, 300px);\n      width: min(340px, calc(100vw - 34px));\n    }\n\n    .audio-player-controls {\n      grid-template-columns: 58px minmax(0, 1fr);\n    }\n\n    .audio-player-utilities {\n      display: none;\n    }\n\n    .audio-player-transport {\n      gap: 4px;\n      justify-content: space-between;\n    }\n\n    .audio-player-skip,\n    .audio-player-chapter-control {\n      height: 32px;\n      width: 32px;\n    }\n\n    .audio-player-main-toggle {\n      height: 40px;\n      width: 40px;\n    }\n\n    .audio-player-options {\n      margin-inline: -1px;\n    }\n\n    .audio-question-choice {\n      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));\n    }\n\n    .audio-question-choice-options {\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n    }\n\n    .audio-question-choice-option {\n      min-height: 40px;\n    }\n  }\n}\n'''
              css.write_text(css_text)

          workflow = Path('.github/workflows/apply-audio-player-redesign.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/audio-section-companion.tsx app/components/audio-player-provider.tsx app/site.css .github/workflows/apply-audio-player-redesign.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild learning audio player UI"
          git push
