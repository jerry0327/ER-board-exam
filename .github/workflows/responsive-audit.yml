name: Responsive render audit

on:
  push:
    branches:
      - agent/responsive-render-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Chromium responsive audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start real application
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/em-board-responsive-audit.log 2>&1 &
          echo $! > /tmp/em-board-responsive-audit.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/em-board-responsive-audit.log
          exit 1

      - name: Capture responsive render matrix
        env:
          CI_BASE_URL: http://127.0.0.1:5173
          CI_AUDIT_OUT_DIR: qa-responsive-audit
        run: node scripts/ci-responsive-audit.mjs

      - name: Print app log on failure
        if: failure()
        run: tail -n 250 /tmp/em-board-responsive-audit.log || true

      - name: Upload responsive audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: responsive-render-audit-${{ github.run_id }}
          path: qa-responsive-audit
          if-no-files-found: error
          retention-days: 7
