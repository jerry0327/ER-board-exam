name: Final audio scope polish

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/final-audio-scope-polish.py

permissions:
  contents: write

jobs:
  polish-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped playback timing polish
        run: python3 .github/final-audio-scope-polish.py
      - name: Commit scope polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/audio-section-companion.tsx tests/audio-player-section-subtitle-contract.test.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Fix scoped audio end timing"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Focused contracts
        run: |
          node --experimental-strip-types --test \
            tests/audio-player-section-subtitle-contract.test.mjs \
            tests/audio-player-dock-contract.test.mjs \
            tests/audio-chapters.test.mjs
