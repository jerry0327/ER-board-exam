name: Clean Section layout

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/clean-section-layout.yml

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy Section-open layout rules
        run: |
          python3 .github/remove-section-layout-rules.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site.css
          git commit -m "Remove legacy Section-open layout mutation"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start actual app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/clean-section-layout.log 2>&1 &
          for attempt in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/clean-section-layout.log
          exit 1
      - name: Verify actual runtime
        run: |
          mkdir -p visual-proof
          node .github/verify-clean-audio-layout.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: clean-audio-player-layout-proof
          path: visual-proof/*.png
          if-no-files-found: error
      - name: Cleanup temporary verification helpers
        if: always()
        run: |
          git pull --rebase
          git rm -f .github/remove-section-layout-rules.py .github/verify-clean-audio-layout.mjs .github/workflows/clean-section-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Section layout verification helpers"
          git push
