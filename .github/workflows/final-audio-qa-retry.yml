name: Final audio player QA retry

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/final-audio-qa-retry.yml

permissions:
  contents: write

jobs:
  final-audio-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix revision guard narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/components/audio-section-companion.tsx')
          text = p.read_text()
          old = '''  const activeBundle = bundle?.sourceId === currentSource?.id && bundle.sourceRevision === currentSource.revision ? bundle : null;
          const activeScope = scope?.sourceId === currentSource?.id && scope.sourceRevision === currentSource.revision ? scope : null;'''
          new = '''  const activeBundle = bundle && currentSource && bundle.sourceId === currentSource.id && bundle.sourceRevision === currentSource.revision ? bundle : null;
          const activeScope = scope && currentSource && scope.sourceId === currentSource.id && scope.sourceRevision === currentSource.revision ? scope : null;'''
          if old not in text:
              raise SystemExit('revision guard text not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/audio-section-companion.tsx
          git commit -m "Fix audio runtime revision guard narrowing"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Run focused audio regression tests
        run: |
          node --test \
            tests/audio-player-section-subtitle-contract.test.mjs \
            tests/audio-player-dock-contract.test.mjs \
            tests/audio-chapters.test.mjs \
            tests/audio-runtime-semantic-package.test.mjs
      - name: Run full project test suite
        run: npm test
      - name: Audit deployed audio runtime
        run: npm run audit:audio-runtime
      - name: Guard subtitle deployment
        run: npm run guard:subtitle-deployment

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          git show d8196e43a11ae988a87fc28d83f5a93b85a3d8a4:.github/verify-final-audio-qa.mjs > .github/verify-final-audio-qa.mjs

      - name: Start actual app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/final-audio-qa.log 2>&1 &
          for attempt in $(seq 1 120); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/final-audio-qa.log
          exit 1

      - name: Run browser interaction and visual QA
        run: |
          mkdir -p visual-proof
          node .github/verify-final-audio-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-audio-player-qa-proof
          path: visual-proof/*
          if-no-files-found: warn

      - name: Cleanup temporary QA helpers
        if: always()
        run: |
          git pull --rebase
          rm -f .github/verify-final-audio-qa.mjs
          git rm -f .github/workflows/final-audio-qa-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove final audio QA retry helper"
          git push
