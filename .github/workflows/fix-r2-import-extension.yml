name: Fix R2 ESM import extension

on:
  push:
    branches: [agent/r2-bulk-content-compression]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-bulk-content-compression
      - name: Patch explicit TypeScript import extensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'worker/content-packs.ts': [
              ('from "./content-pack-r2";', 'from "./content-pack-r2.ts";'),
            ],
            'worker/index.ts': [
              ('from "./content-pack-r2";', 'from "./content-pack-r2.ts";'),
            ],
          }
          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'missing patch anchor in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/fix-r2-import-extension.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/content-packs.ts worker/index.ts .github/workflows/fix-r2-import-extension.yml
          git commit -m "Fix direct ESM resolution for R2 content-pack bridge"
          git push origin HEAD:agent/r2-bulk-content-compression
