name: Diagnose audio layout

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/diagnose-audio-layout.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/audio-diagnostic.log 2>&1 &
          for attempt in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/audio-diagnostic.log
          exit 1
      - run: |
          mkdir -p visual-proof
          node .github/audio-layout-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: audio-layout-diagnostic
          path: visual-proof/*.png
          if-no-files-found: error
      - name: Cleanup diagnostic files
        if: always()
        run: |
          git pull --rebase
          git rm -f .github/audio-layout-diagnostic.mjs .github/workflows/diagnose-audio-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove audio layout diagnostic helpers"
          git push
