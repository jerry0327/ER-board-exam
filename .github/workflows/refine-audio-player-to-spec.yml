      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start actual app
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/player-refine.log 2>&1 &
          for attempt in $(seq 1 120); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/player-refine.log
          exit 1
      - name: Capture refinement proof
        run: |
          mkdir -p visual-proof
          cat > .capture-refined-player.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173/';
          async function entries(page) {
            return page.evaluate(async () => (await (await fetch('/audio/snac/catalog.json')).json()).entries);
          }
          async function seed(page, sourceId) {
            await page.goto(base, { waitUntil: 'domcontentloaded' });
            await page.evaluate(({sourceId}) => localStorage.setItem('em-board-audio-player-v2', JSON.stringify({sourceId,position:0,rate:1,expanded:true,stowed:false,continuousPlay:true,queueIds:[],randomReview:false})), {sourceId});
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.locator('.audio-player-dock.is-expanded').waitFor({ state:'visible', timeout:30000 });
            await page.locator('.audio-section-companion').waitFor({ state:'visible', timeout:30000 });
            await page.waitForTimeout(400);
          }
          const desktop = await browser.newContext({ viewport:{width:1440,height:900}, deviceScaleFactor:1 });
          const page = await desktop.newPage();
          await page.goto(base, { waitUntil:'domcontentloaded' });
          const catalog = await entries(page);
          const textbook = catalog.find(e => e.kind === 'textbook-chapter' || e.kind === 'textbook-section');
          const questionSet = catalog.find(e => e.kind === 'question-set');
          await seed(page, textbook.id);
          await page.locator('.audio-player-dock').screenshot({path:'visual-proof/desktop-expanded.png'});
          const nodes = page.locator('.audio-section-node');
          if (await nodes.count() > 1) {
            await nodes.nth(1).hover();
            await page.waitForTimeout(180);
            await page.locator('.audio-player-dock').screenshot({path:'visual-proof/desktop-hover.png'});
          }
          await page.locator('.audio-section-toggle').click();
          await page.waitForTimeout(150);
          await page.locator('.audio-player-dock').screenshot({path:'visual-proof/desktop-sections-open.png'});
          await page.locator('.audio-section-toggle').click();
          await page.locator('.audio-player-settings > summary').click();
          await page.waitForTimeout(120);
          await page.locator('.audio-player-dock').screenshot({path:'visual-proof/desktop-settings-open.png'});
          if (questionSet) {
            const qn = Number(questionSet.questionStart ?? 1);
            const qid = `${questionSet.questionExam}-Q${String(qn).padStart(3,'0')}`;
            await page.evaluate(({sourceId,qid}) => window.dispatchEvent(new CustomEvent('em-board-question-audio-choice',{detail:{sourceId,questionId:qid}})), {sourceId:questionSet.id,qid});
            await page.locator('.audio-question-choice').waitFor({state:'visible'});
            await page.locator('.audio-question-choice').screenshot({path:'visual-proof/desktop-question-choice.png'});
          }
          await desktop.close();
          const mobile = await browser.newContext({ viewport:{width:412,height:915}, deviceScaleFactor:1 });
          const mp = await mobile.newPage();
          await seed(mp, textbook.id);
          await mp.screenshot({path:'visual-proof/mobile-expanded.png',fullPage:true});
          await mp.locator('.audio-section-toggle').click();
          await mp.waitForTimeout(120);
          await mp.locator('.audio-player-dock').screenshot({path:'visual-proof/mobile-sections-open.png'});
          await mobile.close();
          await browser.close();
          JS
          node .capture-refined-player.mjs
          rm -f .capture-refined-player.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: refined-player-proof
          path: visual-proof/*.png
          if-no-files-found: error
