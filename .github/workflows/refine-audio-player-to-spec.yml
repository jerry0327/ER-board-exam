name: Refine audio player to final design

on:
  push:
    branches:
      - agent/audio-sections-question-scope

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message != 'Refine audio player to final design spec'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Refactor player structure to approved design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          provider = Path('app/components/audio-player-provider.tsx')
          p = provider.read_text()

          p = p.replace('  ListMusic,\n  Pause,', '  ListMusic,\n  Maximize2,\n  Pause,')
          p = p.replace('  Shuffle,\n  SkipBack,', '  Settings,\n  Shuffle,\n  SkipBack,')
          p = p.replace('  Timer,\n  X,', '  Timer,\n  Volume2,\n  X,')

          p = p.replace(
              '  const [playbackRate, setPlaybackRateState] = useState(1);\n',
              '  const [playbackRate, setPlaybackRateState] = useState(1);\n  const [volume, setVolumeState] = useState(1);\n',
          )
          p = p.replace(
              '  const playbackRateRef = useRef(1);\n',
              '  const playbackRateRef = useRef(1);\n  const volumeRef = useRef(1);\n',
          )
          p = p.replace(
              '  const workletRef = useRef<AudioWorkletNode | null>(null);\n',
              '  const workletRef = useRef<AudioWorkletNode | null>(null);\n  const gainNodeRef = useRef<GainNode | null>(null);\n',
          )

          old_release = '''  function releaseAudioOutput() {\n    workletRef.current?.disconnect();\n    workletRef.current = null;\n    detachAudioContextStateListener();\n    const context = audioContextRef.current;\n    audioContextRef.current = null;\n    if (context && context.state !== "closed") {\n      void context.close().catch(() => undefined);\n    }\n  }'''
          new_release = '''  function releaseAudioOutput() {\n    workletRef.current?.disconnect();\n    workletRef.current = null;\n    gainNodeRef.current?.disconnect();\n    gainNodeRef.current = null;\n    detachAudioContextStateListener();\n    const context = audioContextRef.current;\n    audioContextRef.current = null;\n    if (context && context.state !== "closed") {\n      void context.close().catch(() => undefined);\n    }\n  }'''
          if old_release in p:
              p = p.replace(old_release, new_release, 1)

          anchor = '''  function updateSleepTimer(setting: AudioSleepTimer) {'''
          helper = '''  function updateVolume(value: number) {\n    const next = Math.max(0, Math.min(1, value));\n    volumeRef.current = next;\n    setVolumeState(next);\n    const context = audioContextRef.current;\n    const gain = gainNodeRef.current;\n    if (context && gain) {\n      gain.gain.setTargetAtTime(next, context.currentTime, 0.015);\n    }\n  }\n\n  function connectWorkletToOutput(worklet: AudioWorkletNode, context: AudioContext) {\n    let gain = gainNodeRef.current;\n    if (!gain || gain.context !== context) {\n      gain?.disconnect();\n      gain = context.createGain();\n      gain.gain.value = volumeRef.current;\n      gain.connect(context.destination);\n      gainNodeRef.current = gain;\n    }\n    worklet.disconnect();\n    worklet.connect(gain);\n  }\n\n'''
          if 'function connectWorkletToOutput(' not in p:
              if anchor not in p:
                  raise SystemExit('sleep timer anchor missing')
              p = p.replace(anchor, helper + anchor, 1)

          p = p.replace('worklet.connect(context.destination);', 'connectWorkletToOutput(worklet, context);')

          controls_pattern = re.compile(
              r'              <div className="audio-player-controls">[\s\S]*?              \{error && \(',
              re.M,
          )
          controls_replacement = '''              <div className="audio-player-controls">\n                <div className="audio-player-transport" role="group" aria-label="播放控制">\n                  <button\n                    type="button"\n                    className="audio-player-skip"\n                    aria-label="倒退 15 秒"\n                    disabled={phase === "loading"}\n                    onClick={() => jumpBy(-15)}\n                  >\n                    <RotateCcw aria-hidden="true" /><span>15</span>\n                  </button>\n                  <button\n                    type="button"\n                    className="audio-player-chapter-control"\n                    aria-label="播放上一章"\n                    disabled={phase === "loading" || !adjacentAudioSummary(current.id, -1)}\n                    onClick={() => void playAdjacentSource(-1)}\n                  >\n                    <SkipBack aria-hidden="true" />\n                  </button>\n                  <button\n                    type="button"\n                    className="audio-player-main-toggle"\n                    aria-label={isPlaybackActive ? "暫停" : "播放"}\n                    disabled={phase === "loading"}\n                    onClick={() => void togglePlayback()}\n                  >\n                    {isPlaybackActive\n                      ? <Pause aria-hidden="true" />\n                      : <Play aria-hidden="true" />}\n                  </button>\n                  <button\n                    type="button"\n                    className="audio-player-chapter-control"\n                    aria-label={randomReview ? "隨機播放下一章" : "播放下一章"}\n                    disabled={phase === "loading" || !canPlayNext}\n                    onClick={() => void playNextSource()}\n                  >\n                    <SkipForward aria-hidden="true" />\n                  </button>\n                  <button\n                    type="button"\n                    className="audio-player-skip"\n                    aria-label="快進 15 秒"\n                    disabled={phase === "loading"}\n                    onClick={() => jumpBy(15)}\n                  >\n                    <span>15</span><RotateCw aria-hidden="true" />\n                  </button>\n                </div>\n\n                <label className="audio-player-rate">\n                  <span>速度</span>\n                  <select\n                    className="field-control"\n                    value={playbackRate}\n                    aria-label="播放速度"\n                    onChange={(event) => updatePlaybackRate(Number(event.target.value))}\n                  >\n                    {AUDIO_PLAYBACK_RATES.map((rate) => (\n                      <option key={rate} value={rate}>{rate}×</option>\n                    ))}\n                  </select>\n                </label>\n\n                <div className="audio-player-utilities">\n                  <label className="audio-player-volume">\n                    <Volume2 aria-hidden="true" />\n                    <input\n                      type="range"\n                      min="0"\n                      max="1"\n                      step="0.05"\n                      value={volume}\n                      aria-label="音量"\n                      onChange={(event) => updateVolume(Number(event.target.value))}\n                    />\n                  </label>\n                  <details className="audio-player-settings">\n                    <summary className="audio-player-utility" aria-label="播放設定">\n                      <Settings aria-hidden="true" />\n                    </summary>\n                    <div className="audio-player-settings-panel">\n                      <div className="audio-player-options" role="group" aria-label="播放選項">\n                        <label className="audio-player-option audio-player-option-select">\n                          <Timer aria-hidden="true" />\n                          <span className="sr-only">{sleepTimerLabel}</span>\n                          <select\n                            value={sleepTimer ?? ""}\n                            aria-label={sleepTimerLabel}\n                            onChange={(event) => updateSleepTimer(\n                              event.target.value === "chapter-end"\n                                ? "chapter-end"\n                                : event.target.value\n                                  ? Number(event.target.value) as 15 | 30 | 45 | 60\n                                  : null,\n                            )}\n                          >\n                            <option value="">睡眠計時</option>\n                            <option value="chapter-end">本章播完</option>\n                            <option value="15">15 分鐘</option>\n                            <option value="30">30 分鐘</option>\n                            <option value="45">45 分鐘</option>\n                            <option value="60">60 分鐘</option>\n                          </select>\n                        </label>\n                        <button\n                          type="button"\n                          className={`audio-player-option ${continuousPlay ? "is-active" : ""}`.trim()}\n                          aria-pressed={continuousPlay}\n                          aria-label={`連續播放：${continuousPlay ? "開啟" : "關閉"}`}\n                          onClick={() => updateContinuousPlay(!continuousPlay)}\n                        >\n                          <Repeat2 aria-hidden="true" />\n                          <span><strong>連續播放</strong><small>{continuousPlay ? "開" : "關"}</small></span>\n                        </button>\n                        <button\n                          type="button"\n                          className={`audio-player-option ${randomReview ? "is-active" : ""}`.trim()}\n                          aria-pressed={randomReview}\n                          aria-label={`隨機複習：${randomReview ? "開啟" : "關閉"}`}\n                          onClick={() => updateRandomReview(!randomReview)}\n                        >\n                          <Shuffle aria-hidden="true" />\n                          <span><strong>隨機複習</strong><small>{randomReview ? "開" : "關"}</small></span>\n                        </button>\n                        <button\n                          type="button"\n                          className={`audio-player-option ${queueOpen ? "is-active" : ""}`.trim()}\n                          aria-expanded={queueOpen}\n                          aria-controls="audio-player-queue-panel"\n                          onClick={() => setQueueOpen((open) => !open)}\n                        >\n                          <ListMusic aria-hidden="true" />\n                          <span>\n                            <strong>接下來</strong>\n                            <small>{queuedSources.length > 0 ? `${queuedSources.length} 章` : nextUpSource ? "下一章" : "已播完"}</small>\n                          </span>\n                        </button>\n                      </div>\n                      {queueOpen && (\n                        <section id="audio-player-queue-panel" className="audio-player-queue-panel" aria-label="待播內容">\n                          <header>\n                            <span>{queuedSources.length > 0 ? "待播清單" : randomReview ? "隨機複習下一章" : "依章節順序"}</span>\n                            {queuedSources.length > 0 && (\n                              <button type="button" onClick={() => updateQueue([])}>清除</button>\n                            )}\n                          </header>\n                          {queuedSources.length > 0 ? (\n                            <ol>\n                              {queuedSources.slice(0, 4).map((source) => (\n                                <li key={source.id}>\n                                  <span><small>{audioSummaryDisplayMarker(source)}</small><strong>{audioSummaryDisplayTitle(source)}</strong></span>\n                                  <button\n                                    type="button"\n                                    aria-label={`從待播清單移除 ${audioSummaryDisplayName(source)}`}\n                                    onClick={() => removeFromQueue(source.id)}\n                                  >\n                                    <X aria-hidden="true" />\n                                  </button>\n                                </li>\n                              ))}\n                            </ol>\n                          ) : nextUpSource ? (\n                            <p><small>{audioSummaryDisplayMarker(nextUpSource)}</small><strong>{audioSummaryDisplayTitle(nextUpSource)}</strong></p>\n                          ) : (\n                            <p>這個系列已經播放到最後一章。</p>\n                          )}\n                          {!continuousPlay && <small className="audio-player-queue-note">連續播放已關閉，本章播完後會停下。</small>}\n                        </section>\n                      )}\n                      <div className="audio-player-settings-actions">\n                        <button type="button" disabled={phase === "loading"} onClick={() => seekTo(0)}>回到開頭</button>\n                        <button type="button" onClick={dismissPlayer}>關閉播放器</button>\n                      </div>\n                    </div>\n                  </details>\n                  <button\n                    type="button"\n                    className="audio-player-utility audio-player-fullscreen"\n                    aria-label="切換播放器全螢幕"\n                    onClick={() => {\n                      const dock = playerDockRef.current;\n                      if (!dock) return;\n                      if (document.fullscreenElement) void document.exitFullscreen();\n                      else if (dock.requestFullscreen) void dock.requestFullscreen();\n                    }}\n                  >\n                    <Maximize2 aria-hidden="true" />\n                  </button>\n                </div>\n              </div>\n\n              {error && ('''
          p, count = controls_pattern.subn(controls_replacement, p, count=1)
          if count != 1:
              raise SystemExit(f'controls replacement count={count}')

          provider.write_text(p)

          companion = Path('app/components/audio-section-companion.tsx')
          c = companion.read_text()
          c = c.replace('  ChevronDown,\n  ListTree,\n  X,', '  ChevronDown,\n  X,')
          current_anchor = '''  const currentChapter = activeBundle\n    ? currentAudioChapterAt(activeBundle.runtime.metadata, player.position)?.l1 ?? null\n    : null;\n  const currentTitle = activeScope?.title'''
          current_repl = '''  const currentChapter = activeBundle\n    ? currentAudioChapterAt(activeBundle.runtime.metadata, player.position)?.l1 ?? null\n    : null;\n  const currentIndex = currentChapter\n    ? chapters.findIndex((chapter) => chapter.id === currentChapter.id)\n    : -1;\n  const currentTitle = activeScope?.title'''
          if current_anchor in c:
              c = c.replace(current_anchor, current_repl, 1)
          old_summary = '''          <div className="audio-section-current">\n            <small>{activeScope ? "只播放本題" : "目前段落"}</small>\n            <strong title={currentTitle ?? undefined}>{currentTitle ?? "選擇段落"}</strong>\n          </div>\n          <button\n            type="button"\n            className="audio-section-toggle"\n            aria-expanded={sectionOpen}\n            onClick={() => setSectionOpen((open) => !open)}\n          >\n            <ListTree aria-hidden="true" />\n            <span>段落</span>\n            <ChevronDown aria-hidden="true" />\n          </button>'''
          new_summary = '''          <div className="audio-section-current">\n            <small>\n              {activeScope\n                ? "只播放本題"\n                : `目前段落 ${currentIndex >= 0 ? currentIndex + 1 : 1} / ${Math.max(1, chapters.length)}`}\n            </small>\n            {activeScope && <strong title={currentTitle ?? undefined}>{currentTitle}</strong>}\n          </div>\n          <button\n            type="button"\n            className="audio-section-toggle"\n            aria-expanded={sectionOpen}\n            onClick={() => setSectionOpen((open) => !open)}\n          >\n            <span>段落</span>\n            <ChevronDown aria-hidden="true" />\n          </button>'''
          if old_summary not in c:
              raise SystemExit('section summary anchor missing')
          c = c.replace(old_summary, new_summary, 1)
          companion.write_text(c)

          css = Path('app/site.css')
          s = css.read_text()
          marker = '/* Audio Player final design-spec alignment */'
          if marker not in s:
              s += r'''

@layer site-components {
  /* Audio Player final design-spec alignment */
  .audio-player-dock {
    background: var(--site-paper);
    border: 1px solid var(--site-line);
    border-radius: 12px;
    box-shadow: 0 10px 28px color-mix(in srgb, var(--site-ink) 10%, transparent);
    overflow: visible;
  }

  .audio-player-dock.is-expanded {
    width: min(640px, calc(100vw - 28px));
  }

  .audio-player-dock.is-collapsed {
    width: min(330px, calc(100vw - 24px));
  }

  .audio-player-dock.is-expanded .audio-player-mini {
    border-bottom: 0;
    min-height: 48px;
    padding: 13px 16px 2px;
  }

  .audio-player-dock.is-expanded .audio-player-title strong {
    font-size: 14px;
    font-weight: 720;
    line-height: 1.35;
  }

  .audio-player-dock.is-expanded .audio-player-expand {
    height: 30px;
    width: 30px;
  }

  .audio-player-details {
    gap: 7px;
    padding: 0 16px 14px;
  }

  .audio-section-summary {
    align-items: center;
    min-height: 31px;
  }

  .audio-section-current small {
    color: var(--site-muted);
    font-size: 10px;
    line-height: 1.3;
    margin: 0;
  }

  .audio-section-current strong {
    color: var(--site-primary);
    font-size: 11px;
    line-height: 1.3;
    margin-top: 2px;
  }

  .audio-section-toggle {
    background: transparent;
    border: 1px solid var(--site-line);
    border-radius: 7px;
    min-height: 29px;
    padding: 0 8px;
  }

  .audio-section-toggle:hover {
    background: color-mix(in srgb, var(--site-primary) 5%, var(--site-paper));
    border-color: color-mix(in srgb, var(--site-primary) 34%, var(--site-line));
  }

  .audio-player-timeline {
    height: 42px;
    overflow: visible;
    padding: 0;
    position: relative;
  }

  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"] {
    appearance: none;
    background: transparent;
    border: 0;
    box-shadow: none;
    height: 24px;
    margin: 0;
    outline: 0;
    padding: 0;
    position: relative;
    width: 100%;
    z-index: 5;
  }

  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-webkit-slider-runnable-track {
    background: transparent;
    border: 0;
    height: 3px;
  }

  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-moz-range-track {
    background: transparent;
    border: 0;
    height: 3px;
  }

  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    background: var(--site-paper);
    border: 1.5px solid var(--site-primary);
    border-radius: 50%;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--site-primary) 7%, transparent);
    height: 11px;
    margin-top: -4px;
    width: 11px;
  }

  .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-moz-range-thumb {
    background: var(--site-paper);
    border: 1.5px solid var(--site-primary);
    border-radius: 50%;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--site-primary) 7%, transparent);
    height: 11px;
    width: 11px;
  }

  .audio-section-node-layer {
    height: 24px;
    top: 0;
    z-index: 6;
  }

  .audio-section-track-base,
  .audio-section-track-progress {
    border-radius: 1px;
    height: 2px;
    top: 11px;
  }

  .audio-section-track-base {
    background: color-mix(in srgb, var(--site-line-strong) 54%, var(--site-paper));
  }

  .audio-section-track-progress {
    background: var(--site-primary);
  }

  .audio-section-node {
    height: 7px;
    top: 7.5px;
    width: 7px;
  }

  .audio-section-node::before {
    content: "";
    inset: -8px;
    position: absolute;
  }

  .audio-section-node:hover,
  .audio-section-node:focus-visible {
    box-shadow:
      0 0 0 5px color-mix(in srgb, var(--site-primary) 12%, transparent),
      0 0 18px color-mix(in srgb, var(--site-primary) 28%, transparent);
    transform: translateX(-50%) scale(1.35);
  }

  .audio-section-node-tooltip {
    bottom: calc(100% + 11px);
    min-width: 130px;
  }

  .audio-player-timeline > div:last-child {
    font-size: 10px;
    margin-top: -2px;
  }

  .audio-player-controls {
    align-items: center;
    border-top: 0;
    display: flex;
    gap: 7px;
    padding: 2px 0 0;
  }

  .audio-player-transport {
    display: flex;
    flex: 0 0 auto;
    gap: 2px;
    order: 1;
  }

  .audio-player-rate {
    flex: 0 0 auto;
    min-width: 62px;
    order: 2;
  }

  .audio-player-rate > span {
    display: none;
  }

  .audio-player-rate select {
    min-height: 30px;
    padding: 0 24px 0 8px;
  }

  .audio-player-transport :is(.audio-player-skip, .audio-player-chapter-control) {
    background: transparent;
    border: 0;
    border-radius: 50%;
    height: 31px;
    min-height: 31px;
    min-width: 31px;
    padding: 0;
    width: 31px;
  }

  .audio-player-main-toggle {
    border-radius: 50%;
    height: 42px;
    margin-inline: 2px;
    width: 42px;
  }

  .audio-player-utilities {
    align-items: center;
    display: flex;
    flex: 1 1 auto;
    gap: 4px;
    justify-content: flex-end;
    margin-left: auto;
    min-width: 0;
    order: 3;
    position: relative;
  }

  .audio-player-volume {
    align-items: center;
    color: var(--site-muted);
    display: flex;
    flex: 1 1 90px;
    gap: 5px;
    max-width: 118px;
    min-width: 74px;
  }

  .audio-player-volume svg {
    flex: 0 0 auto;
    height: 14px;
    width: 14px;
  }

  .audio-player-volume input[type="range"] {
    accent-color: var(--site-primary);
    min-width: 0;
    width: 100%;
  }

  .audio-player-utility,
  .audio-player-settings > summary {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 50%;
    color: var(--site-ink-soft);
    cursor: pointer;
    display: inline-flex;
    height: 30px;
    justify-content: center;
    list-style: none;
    min-height: 30px;
    min-width: 30px;
    padding: 0;
    width: 30px;
  }

  .audio-player-settings > summary::-webkit-details-marker {
    display: none;
  }

  .audio-player-utility:hover,
  .audio-player-settings > summary:hover {
    background: color-mix(in srgb, var(--site-primary) 6%, var(--site-paper));
  }

  .audio-player-settings {
    position: relative;
  }

  .audio-player-settings-panel {
    background: var(--site-paper);
    border: 1px solid var(--site-line);
    border-radius: 10px;
    bottom: calc(100% + 9px);
    box-shadow: 0 14px 34px color-mix(in srgb, var(--site-ink) 16%, transparent);
    padding: 8px;
    position: absolute;
    right: 0;
    width: 244px;
    z-index: 30;
  }

  .audio-player-settings-panel .audio-player-options {
    border: 0;
    display: grid;
    gap: 3px;
    overflow: visible;
    padding: 0;
  }

  .audio-player-settings-panel .audio-player-option {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 7px;
    display: grid;
    gap: 7px;
    grid-template-columns: 22px minmax(0, 1fr);
    justify-content: start;
    min-height: 34px;
    padding: 5px 7px;
    text-align: left;
    width: 100%;
  }

  .audio-player-settings-panel .audio-player-option:hover {
    background: color-mix(in srgb, var(--site-primary) 6%, var(--site-paper));
  }

  .audio-player-settings-panel .audio-player-option span small {
    display: inline;
    margin-left: 5px;
  }

  .audio-player-settings-panel .audio-player-option-select select {
    min-height: 28px;
    width: 100%;
  }

  .audio-player-settings-actions {
    border-top: 1px solid var(--site-line);
    display: grid;
    gap: 5px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    margin-top: 7px;
    padding-top: 7px;
  }

  .audio-player-settings-actions button {
    background: transparent;
    border: 1px solid var(--site-line);
    border-radius: 7px;
    color: var(--site-ink-soft);
    min-height: 30px;
  }

  .audio-player-settings-panel .audio-player-queue-panel {
    background: var(--site-surface-muted);
    border: 0;
    border-radius: 7px;
    box-shadow: none;
    margin-top: 6px;
    max-height: 165px;
    overflow: auto;
    padding: 7px;
    position: static;
  }

  .audio-player-fullscreen svg,
  .audio-player-settings svg {
    height: 15px;
    width: 15px;
  }

  .audio-question-choice {
    max-width: 330px;
    padding: 14px;
  }

  .audio-question-choice > header {
    margin-bottom: 9px;
  }

  .audio-question-choice-options {
    gap: 7px;
  }

  .audio-question-choice-option {
    border-radius: 7px;
    min-height: 34px;
    padding: 0 10px;
  }

  @media (min-width: 701px) {
    .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) {
      width: min(930px, calc(100vw - 28px));
    }

    .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-player-details {
      padding-right: 324px;
      position: relative;
    }

    .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-section-panel {
      max-height: 230px;
      right: -308px;
      top: 0;
      width: 292px;
    }
  }

  @media (max-width: 700px) {
    .audio-player-dock.is-expanded {
      width: calc(100vw - 24px);
    }

    .audio-player-dock.is-expanded .audio-player-mini {
      min-height: 44px;
      padding: 11px 12px 1px;
    }

    .audio-player-dock.is-expanded .audio-player-title strong {
      display: -webkit-box;
      font-size: 12px;
      line-height: 1.35;
      max-height: 2.7em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .audio-player-details {
      gap: 6px;
      padding: 0 12px 12px;
    }

    .audio-section-summary {
      min-height: 30px;
    }

    .audio-player-controls {
      display: grid;
      gap: 7px 8px;
      grid-template-columns: auto minmax(0, 1fr) auto;
    }

    .audio-player-transport {
      grid-column: 1 / -1;
      justify-content: space-around;
      order: 1;
      width: 100%;
    }

    .audio-player-rate {
      grid-column: 1;
      order: 2;
    }

    .audio-player-utilities {
      display: grid;
      gap: 4px;
      grid-column: 2 / 4;
      grid-template-columns: minmax(0, 1fr) 30px 30px;
      margin-left: 0;
      order: 3;
      width: 100%;
    }

    .audio-player-volume {
      max-width: none;
      width: 100%;
    }

    .audio-player-settings-panel {
      right: -34px;
      width: min(260px, calc(100vw - 48px));
    }

    .audio-section-panel {
      margin-top: 4px;
      max-height: min(48vh, 320px);
      position: static;
      width: 100%;
    }

    .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-player-timeline,
    .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-player-controls {
      display: none;
    }
  }
}
