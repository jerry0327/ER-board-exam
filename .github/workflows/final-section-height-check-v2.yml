name: Verify complete desktop section list

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/final-section-height-check-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Expand desktop section state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/site.css')
          s=p.read_text()
          before=s
          s=s.replace('min-height: 334px;', 'min-height: 354px;', 1)
          s=s.replace('min-height: 276px;', 'min-height: 296px;', 1)
          s=s.replace('max-height: 274px;', 'max-height: 294px;', 1)
          if s == before:
              raise SystemExit('expected desktop section height rules not found')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site.css
          git commit -m "Fit complete desktop section list"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start actual app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/final-height.log 2>&1 &
          for attempt in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/final-height.log
          exit 1
      - name: Assert all 8 section rows fit
        run: |
          mkdir -p visual-proof
          cat > .capture-final-height.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const base='http://127.0.0.1:4173/';
          await page.goto(base,{waitUntil:'domcontentloaded'});
          const entries=await page.evaluate(async()=> (await(await fetch('/audio/snac/catalog.json')).json()).entries);
          const source=entries.find(e=>e.kind==='textbook-chapter'||e.kind==='textbook-section');
          assert.ok(source);
          await page.evaluate(({id})=>localStorage.setItem('em-board-audio-player-v2',JSON.stringify({sourceId:id,position:0,rate:1,expanded:true,stowed:false,continuousPlay:true,queueIds:[],randomReview:false})),{id:source.id});
          await page.reload({waitUntil:'domcontentloaded'});
          await page.locator('.audio-section-companion').waitFor({state:'visible',timeout:30000});
          await page.locator('.audio-section-toggle').click();
          await page.waitForTimeout(100);
          const rows=page.locator('.audio-section-list li');
          assert.equal(await rows.count(),8);
          const panel=await page.locator('.audio-section-panel').boundingBox();
          const last=await rows.last().boundingBox();
          assert.ok(panel&&last);
          assert.ok(last.y+last.height<=panel.y+panel.height+1,`last section clipped: ${JSON.stringify({panel,last})}`);
          await page.locator('.audio-player-dock').screenshot({path:'visual-proof/desktop-sections-open.png'});
          await browser.close();
          JS
          node .capture-final-height.mjs
          rm -f .capture-final-height.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-section-height-proof
          path: visual-proof/desktop-sections-open.png
          if-no-files-found: error
      - name: Remove temporary height workflows
        run: |
          git rm -f .github/workflows/final-section-height-check.yml .github/workflows/final-section-height-check-v2.yml
          git commit -m "Remove final section height verification helpers"
          git push
