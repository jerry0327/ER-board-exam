name: Apply R2 bulk-content refactor

on:
  push:
    branches:
      - agent/r2-bulk-content-compression

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-bulk-content-compression
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Apply deterministic source patch
        run: node scripts/apply-r2-bulk-content-refactor.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-r2-bulk-content-refactor.mjs
          rm .github/workflows/apply-r2-bulk-content-refactor.yml
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/content-packs.ts worker/index.ts scripts/build-verified.sh package.json scripts/apply-r2-bulk-content-refactor.mjs .github/workflows/apply-r2-bulk-content-refactor.yml
          git commit -m "Wire compressed titles and R2 content-pack fallback"
          git push origin HEAD:agent/r2-bulk-content-compression
