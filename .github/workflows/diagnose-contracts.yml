name: Diagnose contract tests

on:
  push:
    branches: [refactor/lazy-feature-css]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-contracts:
    name: Capture contract test output
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build verified production artifact
        run: npm run build

      - name: Run contract and unit tests with captured output
        id: contracts
        shell: bash
        run: |
          set +e
          node scripts/with-uncompressed-static-content.mjs -- node --experimental-strip-types --test tests/*.test.mjs 2>&1 | tee contract-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > contract-tests.exit-code
          exit "$status"

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: contract-test-diagnostics-${{ github.run_id }}
          path: |
            contract-tests.log
            contract-tests.exit-code
          if-no-files-found: error
          retention-days: 3
