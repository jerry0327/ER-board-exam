name: Polish audio player redesign

on:
  push:
    branches:
      - agent/audio-sections-question-scope

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply final interaction polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('app/site.css')
          text = css.read_text()
          marker = '/* Audio Player 2026 Section Redesign */'
          start = text.index(marker)
          head, suffix = text[:start], text[start:]

          suffix = suffix.replace('''  .audio-player-edge-progress,\n  .audio-player-mark,\n  .audio-player-stow {\n    display: none;\n  }''', '''  .audio-player-mark,\n  .audio-player-stow {\n    display: none;\n  }''', 1)

          node_anchor = '''  .audio-section-node.is-past {\n    border-color: var(--site-primary);\n  }'''
          hit_target = '''  .audio-section-node::after {\n    content: "";\n    inset: -8px;\n    position: absolute;\n  }\n\n  .audio-section-node.is-past {\n    border-color: var(--site-primary);\n  }'''
          if '  .audio-section-node::after {' not in suffix:
              if node_anchor not in suffix:
                  raise SystemExit('section node anchor not found')
              suffix = suffix.replace(node_anchor, hit_target, 1)

          suffix = suffix.replace('''  .audio-question-choice-option {\n    align-items: center;\n    background: var(--site-surface-muted);\n    border: 1px solid var(--site-line);\n    border-radius: 8px;\n    display: flex;\n    font-size: 12px;\n    font-weight: 760;\n    justify-content: center;\n    min-height: 42px;''', '''  .audio-question-choice-option {\n    align-items: center;\n    background: var(--site-surface-muted);\n    border: 1px solid var(--site-line);\n    border-radius: 8px;\n    display: flex;\n    font-size: 12px;\n    font-weight: 760;\n    justify-content: center;\n    min-height: 36px;''', 1)

          css.write_text(head + suffix)

          workflow = Path('.github/workflows/polish-audio-player-redesign.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site.css .github/workflows/polish-audio-player-redesign.yml
          git commit -m "Polish audio player interactions"
          git push
