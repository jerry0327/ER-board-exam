name: Canonical display font
on:
  workflow_dispatch:
  push:
    branches: [refactor/css-legacy-retirement]
    paths:
      - 'scripts/canonicalize-display-font.mjs'
      - '.github/workflows/css-display-font-canonicalize.yml'
permissions:
  contents: write
concurrency:
  group: canonical-display-font-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Route direct display fonts through site tokens
        run: node scripts/canonicalize-display-font.mjs
      - name: Verify CSS authority
        run: node scripts/audit-css-authority.mjs
      - name: Commit display-font migration
        run: |
          rm scripts/canonicalize-display-font.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route legacy display fonts through site tokens'
          git push origin HEAD:refactor/css-legacy-retirement
