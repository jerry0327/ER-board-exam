name: Validate audio sections

on:
  push:
    branches:
      - agent/audio-sections-question-scope

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Normalize scoped playback implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          attribute = "data-audio-scoped-playback"

          provider = Path("app/components/audio-player-provider.tsx")
          provider_text = provider.read_text()
          guard = f'    if (document.documentElement.hasAttribute("{attribute}")) return;\n'
          if guard not in provider_text:
              needle = "  const recordListeningProgress = useCallback((forceCompleted = false) => {\n    const source = currentRef.current;"
              replacement = "  const recordListeningProgress = useCallback((forceCompleted = false) => {\n" + guard + "    const source = currentRef.current;"
              if needle not in provider_text:
                  raise SystemExit("recordListeningProgress insertion point not found")
              provider_text = provider_text.replace(needle, replacement, 1)
              provider.write_text(provider_text)

          companion = Path("app/components/audio-section-companion.tsx")
          text = companion.read_text()
          effect = f'''\n  useEffect(() => {{\n    const root = document.documentElement;\n    root.toggleAttribute("{attribute}", Boolean(activeScope));\n    return () => {{ root.removeAttribute("{attribute}"); }};\n  }}, [activeScope]);\n'''
          effect_anchor = "  useEffect(() => {\n    sectionOpenRef.current = sectionOpen;\n  }, [sectionOpen]);\n"
          if "root.toggleAttribute(\"data-audio-scoped-playback\"" not in text:
              if effect_anchor not in text:
                  raise SystemExit("section scope effect insertion point not found")
              text = text.replace(effect_anchor, effect_anchor + effect, 1)
          text = text.replace(
              f'return () => root.removeAttribute("{attribute}");',
              f'return () => {{ root.removeAttribute("{attribute}"); }};',
          )

          stale_scope = '''  useEffect(() => {\n    if (scope && currentSource && scope.sourceId !== currentSource.id) setScope(null);\n  }, [currentSource, scope]);'''
          safe_scope = '''  useEffect(() => {\n    if (!currentSource) {\n      if (scope) setScope(null);\n      return;\n    }\n    if (scope && scope.sourceId !== currentSource.id) setScope(null);\n  }, [currentSource, scope]);'''
          if stale_scope in text:
              text = text.replace(stale_scope, safe_scope, 1)

          collapsed_anchor = '''    if (!player.expanded || player.stowed || !currentSource) {\n      setDetailsTarget(null);\n      setTimelineTarget(null);'''
          collapsed_replacement = '''    if (!player.expanded || player.stowed || !currentSource) {\n      setSectionOpen(false);\n      setDetailsTarget(null);\n      setTimelineTarget(null);'''
          if collapsed_anchor in text:
              text = text.replace(collapsed_anchor, collapsed_replacement, 1)

          choice_anchor = "  async function chooseQuestionOnly() {\n    if (!questionChoice || !choiceSource || loadingChoice) return;\n    setLoadingChoice(true);\n    setChoiceError(null);\n    try {"
          choice_replacement = f'''  async function chooseQuestionOnly() {{\n    if (!questionChoice || !choiceSource || loadingChoice) return;\n    const hadScopedPlayback = document.documentElement.hasAttribute("{attribute}");\n    setLoadingChoice(true);\n    setChoiceError(null);\n    try {{'''
          if "const hadScopedPlayback = document.documentElement.hasAttribute" not in text:
              if choice_anchor not in text:
                  raise SystemExit("question choice insertion point not found")
              text = text.replace(choice_anchor, choice_replacement, 1)

          scope_anchor = '      if (!nextScope) throw new Error("question-section-unavailable");\n      if (player.current?.id === choiceSource.id) {'
          scope_replacement = f'      if (!nextScope) throw new Error("question-section-unavailable");\n      document.documentElement.setAttribute("{attribute}", "true");\n      if (player.current?.id === choiceSource.id) {{'
          if f'document.documentElement.setAttribute("{attribute}", "true");' not in text:
              if scope_anchor not in text:
                  raise SystemExit("question scope arming insertion point not found")
              text = text.replace(scope_anchor, scope_replacement, 1)

          catch_anchor = '    } catch {\n      setChoiceError("目前無法讀取這一題的精準時間範圍；仍可使用五題完整音檔。");'
          catch_replacement = f'''    }} catch {{\n      if (!hadScopedPlayback) document.documentElement.removeAttribute("{attribute}");\n      setChoiceError("目前無法讀取這一題的精準時間範圍；仍可使用五題完整音檔。");'''
          if "if (!hadScopedPlayback) document.documentElement.removeAttribute" not in text:
              if catch_anchor not in text:
                  raise SystemExit("question scope cleanup insertion point not found")
              text = text.replace(catch_anchor, catch_replacement, 1)

          site_css = Path("app/site.css")
          site_text = site_css.read_text()
          style_marker = "/* Audio Section Companion */"
          style_match = re.search(r'const STYLES = String\.raw`(.*?)`;\n\n', text, re.S)
          if style_match:
              styles = style_match.group(1).strip()
              if style_marker not in site_text:
                  site_text = site_text.rstrip() + f'''\n\n@layer site-components {{\n  {style_marker}\n{styles}\n}}\n'''
                  site_css.write_text(site_text)
              text = text[:style_match.start()] + text[style_match.end():]
          elif style_marker not in site_text:
              raise SystemExit("section styles are missing from both component and site.css")

          current_site_text = site_css.read_text()
          cleaned_site_text = current_site_text.replace("display: none !important;", "display: none;")
          if cleaned_site_text != current_site_text:
              site_css.write_text(cleaned_site_text)

          text = text.replace("      <style>{STYLES}</style>\n", "")
          text = text.replace("  useRef,\n", "")
          text = text.replace("  const sectionOpenRef = useRef(false);\n\n", "")
          text = text.replace("  useEffect(() => {\n    sectionOpenRef.current = sectionOpen;\n  }, [sectionOpen]);\n\n", "")
          companion.write_text(text)

          package_json = Path("package.json")
          package_text = package_json.read_text()
          old_test_runner = '"test:expanded": "node --test tests/*.test.mjs'
          new_test_runner = '"test:expanded": "node --experimental-strip-types --test tests/*.test.mjs'
          if old_test_runner in package_text:
              package_json.write_text(package_text.replace(old_test_runner, new_test_runner, 1))

          app_file = Path("app/question-bank-app.tsx")
          app_text = app_file.read_text()
          helper = '''function routeMayOfferLearningAudio(view: NavView, questionId?: string | null) {\n  return (\n    view === "學習指引"\n    || view === "學習音檔"\n    || (view === "詳解閱讀" && Boolean(questionId))\n  );\n}\n\n'''
          helper_anchor = "function canWarmFullQuestionIndex() {"
          if "function routeMayOfferLearningAudio" not in app_text:
              if helper_anchor not in app_text:
                  raise SystemExit("learning audio route helper insertion point not found")
              app_text = app_text.replace(helper_anchor, helper + helper_anchor, 1)

          old_route_logic = '''    const isLearningRoute = view === "學習指引" || view === "學習音檔";\n    const isConcreteReader = view === "詳解閱讀" && Boolean(questionId);\n    if (!isLearningRoute && !isConcreteReader) return;'''
          new_route_logic = '''    if (!routeMayOfferLearningAudio(view, questionId)) return;'''
          if old_route_logic in app_text:
              app_text = app_text.replace(old_route_logic, new_route_logic, 1)
          app_file.write_text(app_text)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/components/audio-player-provider.tsx app/components/audio-section-companion.tsx app/site.css package.json app/question-bank-app.tsx
            git commit -m "Repair audio section validation"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Run npm test with captured log
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - name: Upload npm test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-log
          path: npm-test.log
