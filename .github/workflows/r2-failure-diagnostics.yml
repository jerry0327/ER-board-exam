name: R2 failure diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee qa-r2-build.log
      - name: Focused contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test tests/r2-content-pack-contract.test.mjs 2>&1 | tee qa-r2-contract.log
      - name: Expanded tests and audits
        id: expanded
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/with-uncompressed-static-content.mjs -- npm run test:expanded 2>&1 | tee qa-r2-expanded.log
      - name: Summary
        shell: bash
        run: |
          {
            echo "build=${{ steps.build.outcome }}"
            echo "contract=${{ steps.contract.outcome }}"
            echo "expanded=${{ steps.expanded.outcome }}"
            echo
            echo "===== BUILD TAIL ====="
            tail -n 180 qa-r2-build.log || true
            echo
            echo "===== CONTRACT ====="
            cat qa-r2-contract.log || true
            echo
            echo "===== EXPANDED TAIL ====="
            tail -n 220 qa-r2-expanded.log || true
          } > qa-r2-diagnostics.txt
          cat qa-r2-diagnostics.txt
      - uses: actions/upload-artifact@v6
        with:
          name: r2-failure-diagnostics-${{ github.run_id }}
          path: |
            qa-r2-diagnostics.txt
            qa-r2-build.log
            qa-r2-contract.log
            qa-r2-expanded.log
          retention-days: 3
