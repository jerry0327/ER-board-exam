name: Repair lazy CSS contract expectations

on:
  push:
    branches: [refactor/lazy-feature-css]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-contracts:
    name: Repair and validate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refactor/lazy-feature-css
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Patch stale architecture assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}; got {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/practice-tools.test.mjs",
              'const practice = await readFile(new URL("../app/views/practice-view.impl.tsx", import.meta.url), "utf8");\n',
              'const practice = await readFile(new URL("../app/views/practice-view.impl.tsx", import.meta.url), "utf8");\nconst practiceWrapper = await readFile(new URL("../app/views/practice-view.tsx", import.meta.url), "utf8");\n',
          )
          replace_once(
              "tests/practice-tools.test.mjs",
              '  assert.match(practice, /import "\\.\\.\\/practice-tools\\.css";/u);',
              '  assert.match(practiceWrapper, /import "\\.\\.\\/practice-tools\\.css";/u);',
          )

          replace_once(
              "tests/spotlight.test.mjs",
              'const component = await readFile(new URL("../app/components/global-spotlight.impl.tsx", import.meta.url), "utf8");\n',
              'const component = await readFile(new URL("../app/components/global-spotlight.impl.tsx", import.meta.url), "utf8");\nconst componentWrapper = await readFile(new URL("../app/components/global-spotlight.tsx", import.meta.url), "utf8");\n',
          )
          replace_once(
              "tests/spotlight.test.mjs",
              '  assert.match(component, /import "\\.\\.\\/spotlight\\.css";/u);',
              '  assert.match(componentWrapper, /import "\\.\\.\\/spotlight\\.css";/u);',
          )

          replace_once(
              "tests/panel-visual-language-contract.test.mjs",
              '    assert.match(siteCss, new RegExp(`@import "\\\\./${stylesheet}\\\\.css" layer\\\\(legacy\\\\);`, "u"));',
              '    assert.doesNotMatch(siteCss, new RegExp(`@import "\\\\./${stylesheet}\\\\.css" layer\\\\(legacy\\\\);`, "u"));',
          )
          replace_once(
              "tests/panel-visual-language-contract.test.mjs",
              '  assert.match(siteCss, /only runtime stylesheet entry and the only place where visual[\\s\\S]*tokens or component appearance may be changed/u);',
              '  assert.match(siteCss, /core runtime stylesheet entry and the authority for shared visual[\\s\\S]*feature-only compatibility sheets are[\\s\\S]*imported by their lazy client owners/u);',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and CSS authority
        run: |
          npx tsc --noEmit
          npm run lint
          node scripts/audit-css-authority.mjs

      - name: Build verified production artifact
        run: npm run build

      - name: Run complete contract and unit suite
        run: node scripts/with-uncompressed-static-content.mjs -- node --experimental-strip-types --test tests/*.test.mjs

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/diagnose-contracts.yml
          rm -f .github/workflows/fix-lazy-css-contracts.yml

      - name: Commit validated contract migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/panel-visual-language-contract.test.mjs tests/practice-tools.test.mjs tests/spotlight.test.mjs .github/workflows/diagnose-contracts.yml .github/workflows/fix-lazy-css-contracts.yml
          git diff --cached --check
          git commit -m "test: align contracts with lazy feature CSS"
          git push origin HEAD:refactor/lazy-feature-css
