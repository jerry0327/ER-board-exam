name: Fix section node hit targets

on:
  push:
    branches:
      - agent/audio-sections-question-scope

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Raise clickable section nodes above seek range
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('app/site.css')
          text = css.read_text()
          marker = '/* Audio Player 2026 Section Redesign */'
          start = text.index(marker)
          suffix = text[start:]
          old = '''  .audio-section-node-layer {\n    height: 24px;\n    left: 0;\n    pointer-events: none;\n    position: absolute;\n    right: 0;\n    top: 0;\n    z-index: 4;\n  }'''
          new = '''  .audio-section-node-layer {\n    height: 24px;\n    left: 0;\n    pointer-events: none;\n    position: absolute;\n    right: 0;\n    top: 0;\n    z-index: 6;\n  }'''
          if old not in suffix:
              raise SystemExit('section node layer block not found')
          suffix = suffix.replace(old, new, 1)
          css.write_text(text[:start] + suffix)

          workflow = Path('.github/workflows/fix-audio-section-node-hit-target.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site.css .github/workflows/fix-audio-section-node-hit-target.yml
          git commit -m "Fix clickable section nodes"
          git push
