name: CSS contract diagnostics

on:
  push:
    branches: [refactor/css-legacy-retirement]

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refactor/css-legacy-retirement

      - name: Apply and commit canonical token assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/board-prep.test.mjs')
          text = path.read_text()
          old = r'assert.match(recognizedCss, /\.recognized-filters\s*\{[^}]*border-top:\s*1px solid var\(--line\);/su);'
          new = r'assert.match(recognizedCss, /\.recognized-filters\s*\{[^}]*border-top:\s*1px solid var\(--site-line\);/su);'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('recognized-filters canonical assertion was not found')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/board-prep.test.mjs
          if git diff --cached --quiet; then
            echo 'Canonical assertion already committed.'
            exit 0
          fi
          git commit -m "Fix canonical board prep CSS token contract"
          git push origin HEAD:refactor/css-legacy-retirement
