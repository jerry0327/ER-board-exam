name: CSS contract diagnostics

on:
  push:
    branches: [refactor/css-legacy-retirement]

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refactor/css-legacy-retirement

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair stale board-prep CSS token contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/board-prep.test.mjs")
          text = path.read_text()
          old = r'''  assert.match(css, /\.board-prep-intro\s*\{[^}]*--board-prep-intro-muted:\s*color-mix\(in srgb, var\(--muted\)[^}]*var\(--ink\)\);/su);'''
          new = r'''  assert.match(css, /\.board-prep-intro\s*\{[^}]*--board-prep-intro-muted:\s*color-mix\(in srgb, var\(--site-muted\)[^}]*var\(--site-ink\)\);/su);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale board-prep assertion, found {count}")
          path.write_text(text.replace(old, new))
          PY

      - name: Verify repaired contracts
        run: node scripts/with-uncompressed-static-content.mjs -- node --experimental-strip-types --test tests/board-prep.test.mjs tests/reading-variant-selector-contract.test.mjs

      - name: Commit verified board-prep contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/board-prep.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Update board prep CSS token contract"
            git push origin HEAD:refactor/css-legacy-retirement
          fi
