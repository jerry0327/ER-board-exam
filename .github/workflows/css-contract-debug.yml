name: CSS contract diagnostics

on:
  push:
    branches: [refactor/css-legacy-retirement]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture contract output
        shell: bash
        run: |
          set +e
          node scripts/with-uncompressed-static-content.mjs -- node --experimental-strip-types --test tests/*.test.mjs > css-contract-test.log 2>&1
          status=$?
          cat css-contract-test.log
          printf '\nTEST_EXIT_CODE=%s\n' "$status" >> css-contract-test.log
          exit 0

      - name: Upload contract log
        uses: actions/upload-artifact@v4
        with:
          name: css-contract-test-log
          path: css-contract-test.log
          if-no-files-found: error
          retention-days: 1
