name: CSS contract diagnostics

on:
  push:
    branches: [refactor/css-legacy-retirement]

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refactor/css-legacy-retirement

      - name: Repair stale board-prep CSS token contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/board-prep.test.mjs")
          text = path.read_text()
          old = r'''  assert.match(css, /\.board-prep-intro\s*\{[^}]*--board-prep-intro-muted:\s*color-mix\(in srgb, var\(--muted\)[^}]*var\(--ink\)\);/su);'''
          new = r'''  assert.match(css, /\.board-prep-intro\s*\{[^}]*--board-prep-intro-muted:\s*color-mix\(in srgb, var\(--site-muted\)[^}]*var\(--site-ink\)\);/su);'''
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit(f"unexpected board-prep contract state; stale assertion count={count}")
          PY

      - name: Verify repaired test sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          board = Path("tests/board-prep.test.mjs").read_text()
          selector = Path("tests/reading-variant-selector-contract.test.mjs").read_text()
          assert "var\\(--site-muted\\)" in board and "var\\(--site-ink\\)" in board
          assert 'import { readLegacyCss } from "./css-test-utils.mjs";' in selector
          assert "../app/globals.css" not in selector
          assert selector.count("readLegacyCss()") == 2
          PY

      - name: Commit board-prep contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/board-prep.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Update board prep CSS token contract"
            git push origin HEAD:refactor/css-legacy-retirement
          fi
