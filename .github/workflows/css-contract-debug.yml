name: CSS contract diagnostics

on:
  push:
    branches: [refactor/css-legacy-retirement]

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refactor/css-legacy-retirement

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply candidate contract repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/board-prep.test.mjs')
          text = path.read_text()
          old = r'assert.match(recognizedCss, /\.recognized-filters\s*\{[^}]*border-top:\s*1px solid var\(--line\);/su);'
          new = r'assert.match(recognizedCss, /\.recognized-filters\s*\{[^}]*border-top:\s*1px solid var\(--site-line\);/su);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale --line assertion, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Run full merge gate in candidate tree
        id: gate
        shell: bash
        run: |
          set +e
          npm test > merge-gate.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run validate:artifact >> merge-gate.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          lines = Path('merge-gate.log').read_text(errors='replace').splitlines()
          failures = [i for i, line in enumerate(lines) if line.lstrip().startswith('not ok')]
          if failures:
              idx = failures[0]
              excerpt = lines[max(0, idx - 30):min(len(lines), idx + 180)]
          elif lines:
              excerpt = lines[-220:]
          else:
              excerpt = ['merge-gate.log was empty']
          Path('merge-gate-compact.log').write_text('\n'.join(excerpt) + '\n')
          PY
          printf '\nMERGE_GATE_EXIT_CODE=%s\n' "$status" >> merge-gate-compact.log
          cat merge-gate-compact.log
          exit 0

      - name: Commit verified repair
        if: steps.gate.outputs.status == '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/board-prep.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix canonical board prep CSS token contract"
          git push origin HEAD:refactor/css-legacy-retirement

      - name: Upload compact merge-gate log
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-log
          path: merge-gate-compact.log
          if-no-files-found: error
          retention-days: 1
