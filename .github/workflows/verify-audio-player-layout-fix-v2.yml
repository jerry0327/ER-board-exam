name: Verify corrected audio player layout

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/verify-audio-player-layout-fix-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix portal selector collision
        run: |
          cat >> app/site.css <<'CSS'

          @layer site-features {
            /* Portal-safe timeline selectors: never treat the Section layer as the time row. */
            .audio-player-timeline > input[type="range"] + div {
              inset: 22px 0 auto 0;
              margin: 0;
              position: absolute;
              z-index: 2;
            }

            .audio-player-timeline > div.audio-section-node-layer {
              height: 18px;
              inset: 0 0 auto 0;
              margin: 0;
              position: absolute;
              z-index: 9;
            }
          }
          CSS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site.css
          git commit -m "Fix portal-safe audio timeline selectors"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start actual app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/player-v2.log 2>&1 &
          for attempt in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/player-v2.log
          exit 1
      - name: Verify and capture actual layouts
        run: |
          mkdir -p visual-proof
          cat > .verify-v2.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173/';
          async function getCatalog(p){return p.evaluate(async()=> (await (await fetch('/audio/snac/catalog.json')).json()).entries)}
          async function seed(p,id){await p.goto(base,{waitUntil:'domcontentloaded'});await p.evaluate(id=>localStorage.setItem('em-board-audio-player-v2',JSON.stringify({sourceId:id,position:12,rate:1,expanded:true,stowed:false,continuousPlay:true,queueIds:[],randomReview:false})),id);await p.reload({waitUntil:'domcontentloaded'});await p.locator('.audio-player-dock').waitFor({state:'visible',timeout:30000});await p.locator('.audio-section-companion').waitFor({state:'visible',timeout:30000});await p.waitForTimeout(350)}
          const ctx=await browser.newContext({viewport:{width:1440,height:900}});const p=await ctx.newPage();await p.goto(base,{waitUntil:'domcontentloaded'});const entries=await getCatalog(p);const src=entries.find(e=>e.kind==='textbook-chapter'||e.kind==='textbook-section');assert.ok(src);await seed(p,src.id);
          const dock=p.locator('.audio-player-dock');const input=p.locator('.audio-player-timeline > input[type="range"]');const node=p.locator('.audio-section-node').first();const time=p.locator('.audio-player-timeline > input[type="range"] + div');const layer=p.locator('.audio-section-node-layer');
          const before=await dock.boundingBox();const ib=await input.boundingBox();const nb=await node.boundingBox();const tb=await time.boundingBox();const lb=await layer.boundingBox();assert.ok(before&&ib&&nb&&tb&&lb);
          console.log('desktop geometry',JSON.stringify({dock:before,input:ib,node:nb,time:tb,layer:lb}));
          assert.ok(Math.abs((ib.y+ib.height/2)-(nb.y+nb.height/2))<2,'node/input center mismatch');assert.ok(Math.abs(ib.y-lb.y)<1,'node layer moved away from input');assert.ok(tb.y>=ib.y+18,'time row overlaps track');assert.ok(nb.width<=6&&nb.height<=6,'section node too large');
          await p.screenshot({path:'visual-proof/desktop-expanded.png',fullPage:false});
          await p.locator('.audio-section-toggle').click();await p.waitForTimeout(120);const after=await dock.boundingBox();const panel=await p.locator('.audio-section-panel').boundingBox();assert.ok(after&&panel);console.log('section geometry',JSON.stringify({before,after,panel}));assert.ok(Math.abs(after.width-before.width)<2&&Math.abs(after.height-before.height)<2,'Section panel changed player size');assert.ok(panel.x>=after.x+after.width+4,'Section panel is not a side floating popover');await p.screenshot({path:'visual-proof/desktop-sections-open.png',fullPage:false});
          await p.locator('.audio-section-toggle').click();const t0=await p.locator('.audio-player-timeline').boundingBox();await p.locator('.audio-player-settings > summary').click();await p.waitForTimeout(100);const t1=await p.locator('.audio-player-timeline').boundingBox();const ib2=await input.boundingBox();const nb2=await node.boundingBox();assert.ok(t0&&t1&&ib2&&nb2);assert.ok(Math.abs(t0.y-t1.y)<1&&Math.abs(t0.height-t1.height)<1,'settings moved timeline');assert.ok(Math.abs((ib2.y+ib2.height/2)-(nb2.y+nb2.height/2))<2,'settings broke node alignment');await p.screenshot({path:'visual-proof/desktop-settings.png',fullPage:false});await ctx.close();
          const mc=await browser.newContext({viewport:{width:412,height:915}});const mp=await mc.newPage();await seed(mp,src.id);const md=mp.locator('.audio-player-dock');const mb=await md.boundingBox();await mp.screenshot({path:'visual-proof/mobile-expanded.png',fullPage:false});await mp.locator('.audio-section-toggle').click();await mp.waitForTimeout(100);const ma=await md.boundingBox();const mpanel=await mp.locator('.audio-section-panel').boundingBox();assert.ok(mb&&ma&&mpanel);assert.ok(Math.abs(mb.height-ma.height)<2&&Math.abs(mb.width-ma.width)<2,'mobile Section changed player size');assert.ok(await mp.locator('.audio-player-timeline').isVisible());assert.ok(await mp.locator('.audio-player-controls').isVisible());assert.ok(mpanel.y+mpanel.height<=ma.y+2,'mobile Section panel is not floating above player');await mp.screenshot({path:'visual-proof/mobile-sections-open.png',fullPage:false});await mc.close();await browser.close();
          JS
          node .verify-v2.mjs
          rm -f .verify-v2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: audio-player-layout-proof-v2
          path: visual-proof/*.png
          if-no-files-found: error
      - name: Remove temporary workflow
        if: always()
        run: |
          git pull --rebase
          git rm -f .github/workflows/verify-audio-player-layout-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove audio player layout verification workflow"
          git push
