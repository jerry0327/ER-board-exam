name: Final audio QA pass 6

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/final-audio-qa-pass6.yml

permissions:
  contents: write

jobs:
  final-audio-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update recovery contract for GainNode output graph
        shell: bash
        run: |
          perl -0pi -e 's#assert\.match\(provider, /worklet\\\.disconnect\\\(\\\);\\s\*worklet\\\.connect\\\(context\\\.destination\\\);/u\);#assert.match(provider, /function connectWorkletToOutput\\(worklet: AudioWorkletNode, context: AudioContext\\)[\\s\\S]*?gain = context\\.createGain\\(\\);[\\s\\S]*?gain\\.connect\\(context\\.destination\\);[\\s\\S]*?worklet\\.disconnect\\(\\);[\\s\\S]*?worklet\\.connect\\(gain\\);/u);#' tests/audio-player-dock-contract.test.mjs
          grep -F 'worklet\.connect\(gain\)' tests/audio-player-dock-contract.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/audio-player-dock-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Align audio recovery test with gain output graph"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Focused audio regression tests
        run: |
          node --experimental-strip-types --test \
            tests/audio-player-section-subtitle-contract.test.mjs \
            tests/audio-player-dock-contract.test.mjs \
            tests/audio-chapters.test.mjs \
            tests/audio-runtime-semantic-package.test.mjs

      - name: Full project test suite
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm test

      - name: Audit audio runtime
        run: npm run audit:audio-runtime

      - name: Guard subtitle deployment
        run: npm run guard:subtitle-deployment

      - name: Cleanup QA workflow
        if: always()
        shell: bash
        run: |
          git pull --rebase
          git rm -f .github/workflows/final-audio-qa-pass6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove final audio QA pass 6 workflow" || true
          git push || true
