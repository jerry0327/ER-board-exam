name: Final audio polish

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/final-audio-polish.py

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final polish
        run: python3 .github/final-audio-polish.py
      - name: Commit product polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/audio-section-companion.tsx app/components/audio-player-provider.tsx app/site.css tests/audio-player-section-subtitle-contract.test.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Polish audio section interaction contract"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Focused contracts
        run: |
          node --experimental-strip-types --test \
            tests/audio-player-section-subtitle-contract.test.mjs \
            tests/audio-player-dock-contract.test.mjs \
            tests/audio-chapters.test.mjs
