name: QA main player live proof

on:
  push:
    branches:
      - qa/main-player-live-proof-20260816

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply player visual refinement
        run: |
          if grep -q 'className="audio-section-playhead"' app/components/audio-section-companion.tsx; then
            echo "Visual refinement already applied."
          else
            python scripts/refine-player-visual-language.py
          fi
      - name: Commit refined product code
        run: |
          if git diff --quiet -- app/site.css app/components/audio-section-companion.tsx; then
            echo "No product diff to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/site.css app/components/audio-section-companion.tsx
            git commit -m "Refine audio player visual language"
            git push origin HEAD:qa/main-player-live-proof-20260816
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Validate TypeScript and lint
        run: |
          npx tsc --noEmit
          npm run lint
      - name: Install Playwright for live QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start real app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/em-board-dev.log 2>&1 &
          echo $! > /tmp/em-board-dev.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/em-board-dev.log
          exit 1
      - name: Operate real player and capture screenshots
        env:
          QA_BASE_URL: http://127.0.0.1:5173
          QA_OUT_DIR: qa-player-proof
        run: node scripts/qa-main-player-live-proof.mjs
      - name: Show verification report
        if: always()
        run: |
          test -f qa-player-proof/verification.json && cat qa-player-proof/verification.json || true
          echo '--- dev log tail ---'
          tail -n 100 /tmp/em-board-dev.log || true
      - name: Upload actual runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-player-live-proof
          path: qa-player-proof
          if-no-files-found: error
