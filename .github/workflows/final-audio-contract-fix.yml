name: Final audio contract fix

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/final-audio-contract-fix.py

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Repair scope regressions
        run: python3 .github/final-audio-contract-fix.py
      - name: Commit repaired product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/audio-player-provider.tsx app/site.css
          git diff --cached --quiet && exit 1
          git commit -m "Restore baseline audio transport contract"
          git push
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Focused audio contracts
        run: |
          node --experimental-strip-types --test \
            tests/audio-player-section-subtitle-contract.test.mjs \
            tests/audio-player-dock-contract.test.mjs \
            tests/audio-chapters.test.mjs \
            tests/audio-runtime-semantic-package.test.mjs
