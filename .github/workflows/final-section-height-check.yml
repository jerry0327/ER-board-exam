name: Final section height check

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/final-section-height-check.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fit all desktop sections inside player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/site.css')
          s=p.read_text()
          s=s.replace('min-height: 334px; width: min(930px, calc(100vw - 28px));', 'min-height: 354px; width: min(930px, calc(100vw - 28px));')
          s=s.replace('min-height: 276px; padding-right: 324px;', 'min-height: 296px; padding-right: 324px;')
          s=s.replace('max-height: 274px; position: absolute;', 'max-height: 294px; position: absolute;')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site.css
          git commit -m "Fit complete desktop section list"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/height-check.log 2>&1 &
          for attempt in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/height-check.log
          exit 1
      - name: Capture final desktop section state
        run: |
          mkdir -p visual-proof
          cat > .capture-final-section.mjs <<'JS'
          import assert from 'node:assert/strict';import{chromium}from'playwright';const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:900}});const base='http://127.0.0.1:4173/';await p.goto(base,{waitUntil:'domcontentloaded'});const es=await p.evaluate(async()=> (await(await fetch('/audio/snac/catalog.json')).json()).entries);const t=es.find(e=>e.kind==='textbook-chapter'||e.kind==='textbook-section');await p.evaluate(({id})=>localStorage.setItem('em-board-audio-player-v2',JSON.stringify({sourceId:id,position:0,rate:1,expanded:true,stowed:false,continuousPlay:true,queueIds:[],randomReview:false})),{id:t.id});await p.reload({waitUntil:'domcontentloaded'});await p.locator('.audio-section-companion').waitFor({state:'visible',timeout:30000});await p.locator('.audio-section-toggle').click();await p.waitForTimeout(100);const rows=p.locator('.audio-section-list li');assert.equal(await rows.count(),8);const panel=await p.locator('.audio-section-panel').boundingBox();const last=await rows.last().boundingBox();assert.ok(panel&&last&&last.y+last.height<=panel.y+panel.height+1,`last row clipped: ${JSON.stringify({panel,last})}`);await p.locator('.audio-player-dock').screenshot({path:'visual-proof/desktop-sections-open.png'});await b.close();
          JS
          node .capture-final-section.mjs
          rm -f .capture-final-section.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-section-height-proof
          path: visual-proof/desktop-sections-open.png
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/final-section-height-check.yml
          git commit -m "Remove final section height check"
          git push
