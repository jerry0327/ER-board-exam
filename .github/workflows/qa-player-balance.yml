name: QA player balance

on:
  push:
    branches:
      - fix/original-player-skeleton-enhancements

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply player balance refinement
        run: python scripts/refine-player-balance.py
      - name: Commit product CSS
        run: |
          if git diff --quiet -- app/site.css; then
            echo 'No product CSS diff.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/site.css
            git commit -m 'Refine audio player visual balance'
            git push origin HEAD:fix/original-player-skeleton-enhancements
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript lint and focused contracts
        run: |
          npx tsc --noEmit
          npm run lint
          node --test tests/audio-player-dock-contract.test.mjs tests/audio-player-section-subtitle-contract.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start real app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/em-board-dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/em-board-dev.log
          exit 1
      - name: Live balance QA
        env:
          QA_BASE_URL: http://127.0.0.1:5173
          QA_OUT_DIR: qa-player-balance-proof
        run: node scripts/qa-player-balance.mjs
      - name: Print verification
        if: always()
        run: |
          test -f qa-player-balance-proof/verification.json && cat qa-player-balance-proof/verification.json || true
          echo '--- dev log tail ---'
          tail -n 100 /tmp/em-board-dev.log || true
      - name: Upload real runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-balance-proof
          path: qa-player-balance-proof
          if-no-files-found: error
