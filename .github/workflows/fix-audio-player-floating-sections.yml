name: Fix audio player floating sections

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/fix-audio-player-floating-sections.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visual layout corrections
        run: |
          cat >> app/site.css <<'CSS'

          @layer site-features {
            /* Audio Player floating-section + timeline geometry correction */
            .audio-player-dock.is-expanded {
              overflow: visible;
            }

            .audio-player-details,
            .audio-section-companion {
              overflow: visible;
              position: relative;
            }

            /* Section list is a popover. It never participates in player sizing. */
            .audio-section-panel {
              background: var(--site-paper);
              border: 1px solid var(--site-line);
              border-radius: 11px;
              box-shadow: 0 18px 46px color-mix(in srgb, var(--site-ink) 18%, transparent);
              left: auto;
              margin: 0;
              max-height: min(390px, calc(100vh - 32px));
              overflow: auto;
              position: absolute;
              right: 0;
              top: auto;
              bottom: calc(100% + 58px);
              width: min(290px, calc(100vw - 32px));
              z-index: 120;
            }

            @media (min-width: 1200px) {
              .audio-section-panel {
                bottom: auto;
                left: calc(100% + 12px);
                right: auto;
                top: 0;
                width: 264px;
              }
            }

            /* Undo the former section-open layout expansion. */
            @media (min-width: 701px) {
              .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) {
                min-height: 0;
                width: min(640px, calc(100vw - 28px));
              }
              .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-player-details {
                min-height: 0;
                padding-right: 14px;
              }
              .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-player-controls {
                margin-top: 0;
              }
            }

            @media (max-width: 700px) {
              .audio-section-panel {
                bottom: calc(100% + 54px);
                left: 0;
                max-height: min(44vh, 330px);
                right: 0;
                top: auto;
                width: 100%;
              }
              .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-player-timeline {
                display: block;
              }
              .audio-player-dock.is-expanded:has(.audio-section-toggle[aria-expanded="true"]) .audio-player-controls {
                display: grid;
              }
            }

            /* One coordinate system for range, section track, nodes, and time labels. */
            .audio-player-timeline {
              height: 40px;
              isolation: isolate;
              overflow: visible;
              padding: 0;
              position: relative;
            }

            .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"] {
              appearance: none;
              background: transparent;
              border: 0;
              box-shadow: none;
              height: 18px;
              inset: 0 0 auto 0;
              margin: 0;
              padding: 0;
              position: absolute;
              width: 100%;
              z-index: 8;
            }

            .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-webkit-slider-runnable-track {
              background: transparent;
              border: 0;
              height: 2px;
            }
            .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-moz-range-track {
              background: transparent;
              border: 0;
              height: 2px;
            }

            /* Playback position is the only prominent circular marker. */
            .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-webkit-slider-thumb {
              -webkit-appearance: none;
              background: var(--site-primary);
              border: 2px solid var(--site-paper);
              border-radius: 50%;
              box-shadow: 0 0 0 1px var(--site-primary), 0 2px 7px color-mix(in srgb, var(--site-primary) 24%, transparent);
              height: 11px;
              margin-top: -4.5px;
              width: 11px;
            }
            .audio-player-dock.has-audio-sections .audio-player-timeline > input[type="range"]::-moz-range-thumb {
              background: var(--site-primary);
              border: 2px solid var(--site-paper);
              border-radius: 50%;
              box-shadow: 0 0 0 1px var(--site-primary), 0 2px 7px color-mix(in srgb, var(--site-primary) 24%, transparent);
              height: 11px;
              width: 11px;
            }

            .audio-section-node-layer {
              height: 18px;
              inset: 0 0 auto 0;
              pointer-events: none;
              position: absolute;
              z-index: 9;
            }
            .audio-section-track-base,
            .audio-section-track-progress {
              border-radius: 1px;
              height: 2px;
              left: 0;
              position: absolute;
              top: 8px;
            }
            .audio-section-track-base {
              background: color-mix(in srgb, var(--site-line-strong) 54%, var(--site-paper));
              right: 0;
            }
            .audio-section-track-progress {
              background: var(--site-primary);
            }

            /* Section points stay intentionally subordinate to the playhead. */
            .audio-section-node,
            .audio-section-node.is-current {
              background: var(--site-paper);
              border: 1px solid color-mix(in srgb, var(--site-line-strong) 86%, var(--site-paper));
              border-radius: 50%;
              box-shadow: none;
              height: 5px;
              padding: 0;
              pointer-events: auto;
              position: absolute;
              top: 6.5px;
              transform: translateX(-50%);
              width: 5px;
            }
            .audio-section-node.is-past,
            .audio-section-node.is-current {
              background: color-mix(in srgb, var(--site-primary) 76%, var(--site-paper));
              border-color: var(--site-primary);
            }
            .audio-section-node:hover,
            .audio-section-node:focus-visible {
              background: var(--site-primary);
              border-color: var(--site-primary);
              box-shadow: 0 0 0 4px color-mix(in srgb, var(--site-primary) 10%, transparent);
              transform: translateX(-50%) scale(1.35);
            }

            .audio-section-node-tooltip {
              bottom: 12px;
              z-index: 130;
            }

            .audio-player-timeline > div:last-child {
              inset: 22px 0 auto 0;
              margin: 0;
              position: absolute;
              z-index: 2;
            }

            /* Settings floats above everything without changing timeline geometry. */
            .audio-player-settings[open] {
              z-index: 140;
            }
            .audio-player-settings-panel {
              background: var(--site-paper);
              z-index: 150;
            }
          }
          CSS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site.css
          git commit -m "Fix floating sections and timeline geometry"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start actual app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/audio-player-visual-fix.log 2>&1 &
          for attempt in $(seq 1 120); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/audio-player-visual-fix.log
          exit 1

      - name: Human-layout assertions and screenshots
        run: |
          mkdir -p visual-proof
          cat > .verify-audio-player-layout.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173/';

          async function catalog(page) {
            return page.evaluate(async () => (await (await fetch('/audio/snac/catalog.json')).json()).entries);
          }

          async function seed(page, id, expanded = true) {
            await page.goto(base, { waitUntil: 'domcontentloaded' });
            await page.evaluate(({ id, expanded }) => {
              localStorage.setItem('em-board-audio-player-v2', JSON.stringify({
                sourceId: id,
                position: 12,
                rate: 1,
                expanded,
                stowed: false,
                continuousPlay: true,
                queueIds: [],
                randomReview: false,
              }));
            }, { id, expanded });
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.locator('.audio-player-dock').waitFor({ state: 'visible', timeout: 30000 });
            if (expanded) await page.locator('.audio-section-companion').waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForTimeout(350);
          }

          const desktop = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await desktop.newPage();
          await page.goto(base, { waitUntil: 'domcontentloaded' });
          const entries = await catalog(page);
          const source = entries.find((entry) => entry.kind === 'textbook-chapter' || entry.kind === 'textbook-section');
          assert.ok(source, 'No textbook audio source found');
          await seed(page, source.id, true);

          const dock = page.locator('.audio-player-dock');
          const beforeDock = await dock.boundingBox();
          assert.ok(beforeDock);

          const input = page.locator('.audio-player-timeline > input[type="range"]');
          const node = page.locator('.audio-section-node').first();
          const timeRow = page.locator('.audio-player-timeline > div:last-child');
          assert.ok(await page.locator('.audio-section-node').count() > 1);
          const inputBox = await input.boundingBox();
          const nodeBox = await node.boundingBox();
          const timeBox = await timeRow.boundingBox();
          assert.ok(inputBox && nodeBox && timeBox);
          assert.ok(Math.abs((inputBox.y + inputBox.height / 2) - (nodeBox.y + nodeBox.height / 2)) < 3, 'Section nodes are not aligned to the seek track');
          assert.ok(timeBox.y >= inputBox.y + 18, 'Time labels overlap the seek track');
          assert.ok(nodeBox.width <= 6 && nodeBox.height <= 6, 'Section node is too visually prominent');

          await page.screenshot({ path: 'visual-proof/desktop-expanded.png', fullPage: false });

          await page.locator('.audio-section-toggle').click();
          await page.waitForTimeout(120);
          const afterDock = await dock.boundingBox();
          const panel = page.locator('.audio-section-panel');
          const panelBox = await panel.boundingBox();
          assert.ok(afterDock && panelBox);
          assert.ok(Math.abs(afterDock.height - beforeDock.height) < 2, `Section popover changed player height: ${beforeDock.height} -> ${afterDock.height}`);
          assert.ok(Math.abs(afterDock.width - beforeDock.width) < 2, `Section popover changed player width: ${beforeDock.width} -> ${afterDock.width}`);
          assert.ok(panelBox.x >= afterDock.x + afterDock.width + 4, 'Desktop Section panel is not an independent side popover');
          await page.screenshot({ path: 'visual-proof/desktop-sections-open.png', fullPage: false });

          await page.locator('.audio-section-toggle').click();
          const timelineBeforeSettings = await page.locator('.audio-player-timeline').boundingBox();
          await page.locator('.audio-player-settings > summary').click();
          await page.waitForTimeout(100);
          const timelineAfterSettings = await page.locator('.audio-player-timeline').boundingBox();
          assert.ok(timelineBeforeSettings && timelineAfterSettings);
          assert.ok(Math.abs(timelineBeforeSettings.y - timelineAfterSettings.y) < 1 && Math.abs(timelineBeforeSettings.height - timelineAfterSettings.height) < 1, 'Settings changed timeline geometry');
          const settingsInputBox = await input.boundingBox();
          const settingsNodeBox = await node.boundingBox();
          assert.ok(settingsInputBox && settingsNodeBox);
          assert.ok(Math.abs((settingsInputBox.y + settingsInputBox.height / 2) - (settingsNodeBox.y + settingsNodeBox.height / 2)) < 3, 'Timeline breaks while settings are open');
          await page.screenshot({ path: 'visual-proof/desktop-settings.png', fullPage: false });
          await desktop.close();

          const mobile = await browser.newContext({ viewport: { width: 412, height: 915 } });
          const mobilePage = await mobile.newPage();
          await seed(mobilePage, source.id, true);
          const mobileDock = mobilePage.locator('.audio-player-dock');
          const mobileBefore = await mobileDock.boundingBox();
          await mobilePage.screenshot({ path: 'visual-proof/mobile-expanded.png', fullPage: false });
          await mobilePage.locator('.audio-section-toggle').click();
          await mobilePage.waitForTimeout(100);
          const mobileAfter = await mobileDock.boundingBox();
          const mobilePanel = await mobilePage.locator('.audio-section-panel').boundingBox();
          assert.ok(mobileBefore && mobileAfter && mobilePanel);
          assert.ok(Math.abs(mobileAfter.height - mobileBefore.height) < 2, 'Mobile Section popover changed player height');
          assert.ok(await mobilePage.locator('.audio-player-timeline').isVisible(), 'Mobile timeline disappeared when Section opened');
          assert.ok(await mobilePage.locator('.audio-player-controls').isVisible(), 'Mobile controls disappeared when Section opened');
          assert.ok(mobilePanel.y + mobilePanel.height <= mobileAfter.y + 2, 'Mobile Section popover is not floating above the player');
          await mobilePage.screenshot({ path: 'visual-proof/mobile-sections-open.png', fullPage: false });
          await mobile.close();

          await browser.close();
          JS
          node .verify-audio-player-layout.mjs
          rm -f .verify-audio-player-layout.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: audio-player-floating-section-proof
          path: visual-proof/*.png
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        run: |
          git pull --rebase
          git rm -f .github/workflows/fix-audio-player-floating-sections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove audio player visual verification workflow"
          git push
