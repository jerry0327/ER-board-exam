name: Full validation

on:
  workflow_dispatch:
  schedule:
    # Monday 03:00 Asia/Taipei = Sunday 19:00 UTC.
    - cron: "0 19 * * 0"
  pull_request:
    branches: [main]
    paths:
      - "public/data/**"
      - "public/content-packs/**"
      - "public/audio/**"
      - "public/subtitles-runtime/**"
      - "public/subtitles-title-locales/**"
      - "public/learning-documents/**"
      - "scripts/**"
      - "worker/**"
      - "db/**"
      - "drizzle/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/full-validation.yml"

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-validation:
    name: Full corpus and artifact validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full build, tests, and content audits
        run: npm test

      - name: Validate deployable artifact
        run: npm run validate:artifact
