name: QA original player skeleton

on:
  push:
    branches:
      - fix/original-player-skeleton-enhancements

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild on original player skeleton
        run: |
          if grep -q 'className="audio-section-slot"' app/components/audio-player-provider.tsx; then
            echo 'Original skeleton enhancement already applied.'
          else
            python scripts/rebuild-player-on-original-skeleton.py
          fi
          if grep -q 'async function overlayMetrics' scripts/qa-original-player-skeleton.mjs; then
            echo 'Mobile overlay QA is already current; skip legacy QA rewrite helper.'
          else
            python scripts/fix-original-skeleton-contract-regex.py
          fi
          python scripts/refine-mobile-audio-overlays.py
      - name: Commit product and contract changes
        run: |
          if git diff --quiet -- app/components/audio-player-provider.tsx app/components/audio-section-companion.tsx app/site.css tests/audio-player-dock-contract.test.mjs tests/audio-player-section-subtitle-contract.test.mjs; then
            echo 'No product/contract diff.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/components/audio-player-provider.tsx app/components/audio-section-companion.tsx app/site.css tests/audio-player-dock-contract.test.mjs tests/audio-player-section-subtitle-contract.test.mjs
            git commit -m 'Optimize mobile audio overlays'
            git push origin HEAD:fix/original-player-skeleton-enhancements
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript lint and focused contracts
        run: |
          npx tsc --noEmit
          npm run lint
          node --test tests/audio-player-dock-contract.test.mjs tests/audio-player-section-subtitle-contract.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start real app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/em-board-dev.log 2>&1 &
          echo $! > /tmp/em-board-dev.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/em-board-dev.log
          exit 1
      - name: Live runtime QA
        env:
          QA_BASE_URL: http://127.0.0.1:5173
          QA_OUT_DIR: qa-original-player-proof
        run: node scripts/qa-original-player-skeleton.mjs
      - name: Print verification
        if: always()
        run: |
          test -f qa-original-player-proof/verification.json && cat qa-original-player-proof/verification.json || true
          echo '--- dev log tail ---'
          tail -n 100 /tmp/em-board-dev.log || true
      - name: Upload real runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-player-skeleton-proof
          path: qa-original-player-proof
          if-no-files-found: error
