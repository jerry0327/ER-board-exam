name: Final audio player QA

on:
  push:
    branches:
      - agent/audio-sections-question-scope
    paths:
      - .github/workflows/final-audio-qa.yml

permissions:
  contents: write

jobs:
  final-audio-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final QA corrections
        run: |
          python3 .github/final-audio-qa-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/audio-player-provider.tsx app/components/audio-section-companion.tsx app/lib/audio-player-section-events.ts app/site.css tests/audio-player-section-subtitle-contract.test.mjs
          git commit -m "Harden audio Section and subtitle interactions"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run focused audio regression tests
        run: |
          node --test \
            tests/audio-player-section-subtitle-contract.test.mjs \
            tests/audio-player-dock-contract.test.mjs \
            tests/audio-chapters.test.mjs \
            tests/audio-runtime-semantic-package.test.mjs

      - name: Run full project test suite
        run: npm test

      - name: Audit deployed audio runtime
        run: npm run audit:audio-runtime

      - name: Guard subtitle deployment
        run: npm run guard:subtitle-deployment

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start actual app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/final-audio-qa.log 2>&1 &
          for attempt in $(seq 1 120); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/final-audio-qa.log
          exit 1

      - name: Run browser interaction and visual QA
        run: |
          mkdir -p visual-proof
          node .github/verify-final-audio-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-audio-player-qa-proof
          path: visual-proof/*
          if-no-files-found: warn

      - name: Cleanup temporary QA helpers
        if: always()
        run: |
          git pull --rebase
          git rm -f .github/final-audio-qa-patch.py .github/verify-final-audio-qa.mjs .github/workflows/final-audio-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove final audio QA helpers"
          git push
