name: Feature request
description: Propose a focused improvement to ER Board Exam
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need or engineering constraint should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version of the improvement.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable outcomes would make this complete?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Question bank / practice
        - Study guides / reader
        - Audio player / subtitles
        - Search / navigation
        - Analytics / progress
        - Performance
        - Build / CI / repository governance
        - Other
    validations:
      required: true
