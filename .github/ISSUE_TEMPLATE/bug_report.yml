name: Bug report
description: Report a reproducible problem in ER Board Exam
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail to reproduce it without including private or sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Question bank / practice
        - Study guides / reader
        - Audio player / subtitles
        - Search / navigation
        - Analytics / progress
        - Build / CI / deployment
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 140 on Android 16
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add relevant console output or screenshots. Remove secrets, personal data, and copyrighted source material that should not be redistributed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I have removed secrets and sensitive information from this report.
          required: true
